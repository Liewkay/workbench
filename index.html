<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--primary:#2563eb;--primary-dark:#1d4ed8;--accent:#dc2626;--accent-dark:#b91c1c;
--bg-light:#eef2ff;--bg-red:#fef2f2;--text-dark:#1e293b;
--card-bg:#ffffff;--highlight:#dbeafe;--highlight-red:#fee2e2;--bg-soft:#f8fafc;
--gray:#64748b;--light-gray:#f1f5f9;
--orange:#ff9500;--red:#dc2626;--shadow:0 2px 8px rgba(0,0,0,.08);
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text-dark);background:var(--bg-light);touch-action:manipulation}
#app{display:flex;height:100%;height:100dvh}
#sidebar{width:30%;min-width:110px;max-width:140px;background:linear-gradient(180deg,#fff 0%,var(--bg-soft) 100%);display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid var(--bg-light);padding-top:env(safe-area-inset-top)}
.sidebar-header{display:flex;flex-direction:column;align-items:flex-start;padding:14px 8px 12px;border-bottom:1px solid var(--bg-light)}
.sidebar-title-row{display:flex;align-items:center;gap:4px;width:fit-content}
.sidebar-logo{font-size:24px;line-height:1;flex-shrink:0}
.sidebar-title{font-size:13px;font-weight:800;color:var(--text-dark);line-height:1.2;letter-spacing:.3px}
.sidebar-tagline{font-size:9px;color:var(--gray);margin-top:1px;white-space:nowrap;width:100%;text-align:justify;text-align-last:justify;-webkit-text-align-last:justify;letter-spacing:1px}
.nav-item{display:flex;flex-direction:row;align-items:center;padding:12px 8px;cursor:pointer;transition:all .2s;border:none;background:none;font-size:14px;color:var(--text-dark);gap:8px;flex-shrink:0;white-space:nowrap;text-align:left}
.nav-item .icon{font-size:14px;line-height:1;flex-shrink:0}
.nav-category{padding:14px 8px 4px;border-bottom:1px dashed var(--bg-light);margin-bottom:4px}
.nav-category:first-child{padding-top:8px}
.nav-category-title{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:2px}
.nav-category-desc{font-size:10px;color:var(--gray);margin-bottom:6px}
.nav-item.active{background:var(--highlight-red);color:var(--accent-dark);font-weight:600;border-left:3px solid var(--accent);padding-left:5px}
.nav-item:active{background:var(--bg-light)}
#content{flex:1;overflow-y:auto;background:var(--bg-soft);-webkit-overflow-scrolling:touch;padding:10px 10px 80px 10px}
.panel{display:none;animation:fadeIn .25s ease}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card-bg);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:700;color:var(--text-dark);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-title{font-size:13px;font-weight:600;color:var(--gray);margin:14px 0 8px;padding-left:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 16px;border-radius:10px;border:none;font-size:13px;cursor:pointer;transition:all .2s;background:var(--primary);color:#fff;font-weight:600}
.btn:active{transform:scale(.95)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-danger{background:var(--red)}
.btn-gray{background:var(--gray)}
.btn-block{width:100%;padding:11px}
input,textarea,select{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px;background:#fff;color:var(--text-dark);font-family:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:60px}
label{font-size:12px;color:var(--gray);display:block;margin-bottom:4px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag-green{background:var(--highlight);color:var(--primary-dark)}
.tag-gray{background:var(--light-gray);color:#666}
.tag-orange{background:#fff3e0;color:var(--orange)}
.tag-red{background:var(--highlight-red);color:var(--red)}
.fab{position:fixed;right:16px;bottom:20px;width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(220,38,38,.4);cursor:pointer;z-index:50;border:none}
.fab:active{transform:scale(.9)}
#toast-container{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;pointer-events:none}
.toast{background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;margin-bottom:8px;animation:toastIn .3s;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1}}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#modal-overlay.show{display:flex}
#modal-content{background:#fff;border-radius:16px;padding:18px;max-width:400px;width:100%;max-height:85vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;text-align:center}
.form-group{margin-bottom:12px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calendar .cal-header{font-size:10px;color:var(--gray);padding:4px 0}
.calendar .cal-day{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:42px;font-size:11px;padding:3px 0;border-radius:10px;cursor:pointer;line-height:1.1}
.calendar .cal-day .lunar{font-size:9px;color:var(--gray);margin-top:2px;transform:scale(.92)}
.calendar .cal-day.today{background:var(--accent);color:#fff;font-weight:700}
.calendar .cal-day.today .lunar{color:#fff;opacity:.9}
.calendar .cal-day.other{color:#ccc}
.progress-bar{height:8px;background:var(--light-gray);border-radius:4px;overflow:hidden}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.toggle{position:relative;width:44px;height:24px;background:#ccc;border-radius:12px;cursor:pointer;transition:all .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:all .2s}
.toggle.on::after{left:22px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bg-light);gap:10px}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:13px;font-weight:600;flex:1;min-width:0}
.setting-desc{font-size:11px;color:var(--gray);margin-top:2px}
.switch-row{display:flex;align-items:center;gap:10px}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}
.task-item{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;margin-bottom:6px;background:var(--bg-soft);transition:all .2s}
.task-item.done{opacity:.5}
.task-item.done .task-text{text-decoration:line-through;color:var(--gray)}
.task-time{font-size:12px;font-weight:700;color:var(--primary-dark);min-width:38px}
.task-text{font-size:13px;flex:1}
.task-item.hotspot-item{background:linear-gradient(135deg,#fff8e1,#fff3e0);border:1px dashed var(--orange)}
.task-action-btn{width:28px;height:28px;border-radius:8px;border:none;background:transparent;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.5}
.task-action-btn:active{transform:scale(.9);background:var(--bg-light);opacity:1}
.product-card{position:relative;overflow:hidden;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;gap:10px}
.product-card .swipe-content{display:flex;gap:10px;width:100%;transition:transform .2s}
.product-card .swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex}
.product-card .swipe-actions button{width:64px;border:none;font-size:11px;color:#fff;cursor:pointer}
.product-thumb{width:54px;height:54px;border-radius:8px;object-fit:cover;background:var(--light-gray);flex-shrink:0}
.product-info{flex:1;min-width:0}
.product-title{font-size:13px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.product-price{color:var(--red);font-weight:700;font-size:14px}
.xhs-note{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;gap:10px}
.xhs-cover{width:50px;height:50px;border-radius:8px;background:var(--bg-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.news-item{padding:10px 0;border-bottom:1px solid var(--bg-light)}
.news-item:last-child{border-bottom:none}
.news-title{font-size:13px;font-weight:600;margin-bottom:4px}
.news-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--gray)}
.heat{color:var(--orange)}
.suggestion-item{background:var(--bg-soft);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.suggestion-text{font-size:12px;flex:1;line-height:1.5}
.diet-record{display:flex;gap:10px;padding:8px;border-radius:8px;background:var(--bg-soft);margin-bottom:6px;align-items:center}
.diet-photo{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--light-gray)}
.skill-item{background:var(--bg-soft);border-radius:10px;padding:10px;margin-bottom:8px}
.subtask{display:flex;align-items:center;gap:8px;padding:6px 0 6px 12px;font-size:12px}
.review-history-item{padding:10px;border-radius:10px;background:var(--bg-soft);margin-bottom:6px;cursor:pointer}
.review-detail{display:none;margin-top:8px;font-size:12px;line-height:1.6;color:#555}
.review-detail.show{display:block}
.stat-capsule{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.mood-btn{font-size:24px;cursor:pointer;padding:8px;border-radius:10px;transition:all .2s}
.mood-btn.selected{background:var(--highlight)}
.mood-btn:active{transform:scale(.9)}
.cat-tab{padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;white-space:nowrap;transition:all .2s}
.cat-tab.active{background:var(--accent);color:#fff}
.hidden{display:none!important}
.empty{text-align:center;padding:30px 10px;color:var(--gray);font-size:13px}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.countdown-badge{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;padding:10px 14px;border-radius:12px;text-align:center;font-size:13px;font-weight:600}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--highlight);border-radius:3px}
.fav-card{background:var(--card-bg);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);transition:all .2s;cursor:pointer}
.fav-card:active{transform:scale(.98)}
.fav-card-title{font-size:13px;font-weight:600;color:var(--text-dark);margin-bottom:4px;line-height:1.4}
.fav-card-meta{font-size:11px;color:var(--gray);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fav-card-summary{font-size:11px;color:#666;line-height:1.5;margin-bottom:6px;background:var(--bg-soft);padding:6px 8px;border-radius:8px}
.fav-tags-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.fav-tag-chip{padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;background:var(--highlight);color:var(--primary-dark)}
.fav-keyword-chip{padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;background:var(--highlight-red);color:var(--accent-dark)}
.fav-actions{display:flex;gap:4px;align-items:center;margin-top:6px}
.fav-detail-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.fav-detail-label{font-size:11px;font-weight:700;color:var(--gray);min-width:56px;flex-shrink:0;padding-top:2px}
.fav-detail-value{font-size:12px;color:var(--text-dark);flex:1;min-width:0;word-break:break-all}
.batch-area{width:100%;min-height:120px;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:12px;background:#fff;font-family:inherit;outline:none;resize:vertical}
.batch-area:focus{border-color:var(--primary)}
.import-preview-item{padding:8px;border-radius:8px;background:var(--bg-soft);margin-bottom:6px;font-size:12px}
.import-preview-item .ipt-title{font-weight:600;margin-bottom:2px}
.import-preview-item .ipt-meta{font-size:10px;color:var(--gray)}
.tag-filter-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tag-filter-chip{padding:3px 10px;border-radius:16px;font-size:10px;cursor:pointer;background:var(--light-gray);color:var(--gray);transition:all .2s;white-space:nowrap}
.tag-filter-chip.active{background:var(--accent);color:#fff}
.sort-bar{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:11px}
.sort-bar select{width:auto;padding:4px 8px;font-size:11px}
input[type="range"]{-webkit-appearance:none;-moz-appearance:none;appearance:none;width:60px;height:16px;background:transparent;outline:none;margin:0;padding:0;cursor:pointer}
input[type="range"]::-webkit-slider-runnable-track{height:6px;background:var(--light-gray);border-radius:3px}
input[type="range"]::-moz-range-track{height:6px;background:var(--light-gray);border-radius:3px}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--primary);margin-top:-4px;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--primary);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sidebar-toggle{position:fixed;top:10px;left:10px;width:36px;height:36px;border-radius:10px;border:none;background:var(--card-bg);box-shadow:var(--shadow);font-size:18px;cursor:pointer;z-index:60;display:flex;align-items:center;justify-content:center;transition:all .2s}
.sidebar-toggle:active{transform:scale(.9)}
#app.sidebar-hidden #sidebar{display:none}
#app.sidebar-hidden #content{width:100%;padding-top:52px}
</style>
</head>

function _lYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(LUNAR_INFO[y-1900]&i)?1:0;return s+_lLeapDays(y)}
function _lLeapDays(y){const m=_lLeapMonth(y);return m?(LUNAR_INFO[y-1900]&0x10000)?30:29:0}
function _lLeapMonth(y){return LUNAR_INFO[y-1900]&0xf}
function _lMonthDays(y,m){return(LUNAR_INFO[y-1900]&(0x10000>>m))?30:29}
function _toLunar(d){
let base=new Date(1900,0,31);let offset=Math.floor((d-base)/86400000);
let y=1900;for(;y<2101&&offset>0;y++){offset-=_lYearDays(y)}
if(offset<0){offset+=_lYearDays(y-1);y--}
let leap=_lLeapMonth(y),isLeap=false,month=1;
for(;month<13&&offset>0;month++){
let days;if(isLeap&&month===(leap+1)){isLeap=false;month--}
if(month===(leap+1)&&!isLeap){isLeap=true;days=_lLeapDays(y)}else{days=_lMonthDays(y,month)}
offset-=days;if(isLeap&&month===leap){isLeap=false}
}
if(offset===0&&leap>0&&month===leap+1){if(isLeap){isLeap=false}else{isLeap=true;month--}}
if(offset<0){offset+=_lMonthDays(y,--month)}
return{y:y,m:month,d:offset+1,leap:isLeap}
}

function parseShareText(text,platform){
text=(text||"").trim();
if(!text)return null;
const urlMatch=text.match(/https?:\/\/[^\s，。]+/);
const url=urlMatch?urlMatch[0]:"";
let clean=text.replace(url,"").replace(/复制此链接[^\s]*$/,"").replace(/打开[Dd]ou[音污]短视频[^\s]*/,"").replace(/，直接观看视频！?/,"").trim();
const tagMatches=clean.match(/#[^\s#]+/g)||[];
const tags=tagMatches.map(t=>t.replace(/^#/,"").trim()).filter(t=>t.length>0);
clean=clean.replace(/#[^\s#]+/g,"").replace(/\s+/g," ").trim();
let title=clean;
let desc=clean;
if(clean.length>40){const sep=clean.search(/[！。！？\n!?.]/);if(sep>5&&sep<60){title=clean.slice(0,sep+1).trim();desc=clean.slice(sep+1).trim()||clean}}
if(!title&&url){title=platform==="douyin"?"【抖音视频】":platform==="xhs"?"【小红书笔记】":"【收藏链接】"}
const author="";
return{url,title,description:desc,tags,author};
}
function extractKeywords(text,n){
n=n||5;
text=(text||"").replace(/https?:\/\/[^\s]+/g,"").replace(/#[^\s#]+/g,"").replace(/[^\u4e00-\u9fa5a-zA-Z0-9\s]/g," ").trim();
if(!text)return[];
const stopWords=new Set(["的","了","是","在","我","有","和","就","不","人","都","一","上","也","很","到","说","要","去","你","会","着","没","看","好","这","那","他","她","它","们","个","来","中","做","把","被","让","从","向","为","以","于","对","给","跟","和","与","及","或","但","而","如","若","则","才","又","且","并","the","a","an","is","are","was","were","to","of","in","on","at","for","and","or","but","with"]);
const freq={};
for(let len=2;len<=3;len++){
for(let i=0;i<=text.length-len;i++){
const word=text.slice(i,i+len);
if(/\d/.test(word)&&len===2)continue;
if(len===2&&!/[\u4e00-\u9fa5]/.test(word))continue;
if(len===3&&!/[\u4e00-\u9fa5]{2,}/.test(word))continue;
const parts=len===2?[word]:[word.slice(0,2),word.slice(1,3)];
if(parts.some(p=>stopWords.has(p)))continue;
freq[word]=(freq[word]||0)+1;
}
}
const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
const result=[];
const used=new Set();
for(const[w,c]of sorted){
if(result.length>=n)break;
let overlap=false;
for(const u of used){if(w.includes(u)||u.includes(w)){if(c<=freq[u]+1){overlap=true;break}}}
if(!overlap){result.push(w);used.add(w)}
}
return result;
}
function generateSummary(text){
text=(text||"").replace(/https?:\/\/[^\s]+/g,"").replace(/#[^\s#]+/g,"").replace(/\s+/g," ").trim();
if(!text)return"暂无描述";
if(text.length<=80)return text;
const cut=text.slice(0,80);
const lastSep=cut.lastIndexOf("，");
if(lastSep>40)return cut.slice(0,lastSep)+"...";
return cut+"...";
}
function analyzeContent(parsed){
const fullText=((parsed.title||"")+" "+(parsed.description||"")).trim();
return{
summary:generateSummary(fullText)
};
}
function batchParse(text,platform){
const lines=text.split(/\n/).map(l=>l.trim()).filter(l=>l.length>0);
const results=[];
for(const line of lines){
const parsed=parseShareText(line,platform);
if(parsed&&(parsed.url||parsed.title)){
const analysis=analyzeContent(parsed);
results.push({...parsed,...analysis});
}
}
return results;
}

Panels.plan={
render(){
const now=new Date();
const y=now.getFullYear(),m=now.getMonth(),today=now.getDate();
const firstDay=new Date(y,m,1).getDay();
const daysInMonth=new Date(y,m+1,0).getDate();
const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const weekDays=["日","一","二","三","四","五","六"];
let calHtml=`<div style="text-align:center;font-size:14px;font-weight:700;margin-bottom:8px">${y}年${monthNames[m]}</div><div class="calendar">`;
weekDays.forEach(w=>calHtml+=`<div class="cal-header">${w}</div>`);
for(let i=0;i<firstDay;i++)calHtml+=`<div class="cal-day other"></div>`;
for(let i=1;i<=daysInMonth;i++){
const ld=fmtLunar(new Date(y,m,i));
calHtml+=`<div class="cal-day${i===today?" today":""}"><span>${i}</span><span class="lunar">${ld}</span></div>`;
}
calHtml+="</div>";

const tasks=Store.get("todayTasks");
let tasksHtml="";
tasks.forEach((t,i)=>{
const isHot=t.isHotspot;
let extraHtml="";
if(isHot){
const ai=getAIHotData();
extraHtml=`<div style="margin-top:8px;padding:8px;background:#fff;border-radius:8px;font-size:11px;line-height:1.6">
<div style="font-weight:600;color:var(--orange);margin-bottom:4px">📡 热点联动 · 今日热点速递</div>
${ai.news.slice(0,3).map(n=>`<div style="padding:3px 0;border-bottom:1px dashed #eee"><span class="heat">${"🔥".repeat(Math.min(n.heat,3))}</span> ${n.title}</div>`).join("")}
<div style="font-weight:600;color:var(--primary-dark);margin:6px 0 3px">💡 选题建议</div>
${ai.suggestions.slice(0,2).map(s=>`<div style="padding:2px 0">📌 ${s.text}</div>`).join("")}
<div style="text-align:right;margin-top:4px"><button class="btn btn-sm btn-outline" onclick="switchPanel('aihot')">查看全部 →</button></div>
</div>`;
}
tasksHtml+=`<div class="task-item${t.done?" done":""}${isHot?" hotspot-item":""}" data-idx="${i}">
<span class="task-time">${t.time}⌛️</span>
<div style="flex:1;cursor:pointer" class="task-body">
<div class="task-text">${isHot?"🔥 "+t.place:"📍 "+t.place}</div>
${extraHtml}
</div>
<div style="display:flex;gap:4px;flex-shrink:0">
<button class="task-action-btn" onclick="event.stopPropagation();Panels.plan.editTask(${i})" title="编辑">✏️</button>
<button class="task-action-btn" onclick="event.stopPropagation();Panels.plan.deleteTask(${i})" title="删除">🗑</button>
</div>
${t.done?"✅":""}
</div>`;
});

return`<div class="card">
<div class="card-title">🗓️ ${monthNames[m]}日历</div>
${calHtml}
</div>
<div class="card">
<div class="card-title">📋 今日行程 <span style="margin-left:auto"><button class="btn btn-sm btn-outline" onclick="Panels.plan.addTask()">➕ 添加</button></span></div>
${tasksHtml}
</div>`;
},
init(){
$$(".task-item").forEach(el=>{
const body=el.querySelector(".task-body");
if(body){
body.addEventListener("click",()=>{
const idx=parseInt(el.dataset.idx);
const tasks=Store.get("todayTasks");
tasks[idx].done=!tasks[idx].done;
Store.set("todayTasks",tasks);
el.classList.toggle("done");
});
}
});
},
addTask(){
showModal(`<div class="modal-title">➕ 添加行程</div>
<div class="form-group"><label>时间</label><input id="task-time" type="time" placeholder="如：08:00"></div>
<div class="form-group"><label>地点 / 事项</label><input id="task-place" placeholder="如：工作室·内容创作"></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="task-save">添加</button></div>`);
$("#task-save").onclick=()=>{
const time=$("#task-time").value;
const place=$("#task-place").value.trim();
if(!time||!place){toast("请填写完整");return}
const tasks=Store.get("todayTasks");
tasks.push({time,place,done:false});
tasks.sort((a,b)=>a.time.localeCompare(b.time));
Store.set("todayTasks",tasks);
closeModal();rerender();toast("✅ 行程已添加");
};
},
editTask(i){
const tasks=Store.get("todayTasks");
const t=tasks[i];
showModal(`<div class="modal-title">✏️ 编辑行程</div>
<div class="form-group"><label>时间</label><input id="task-time" type="time" value="${t.time}"></div>
<div class="form-group"><label>地点 / 事项</label><input id="task-place" value="${t.place}"></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="task-save">保存</button></div>`);
$("#task-save").onclick=()=>{
const time=$("#task-time").value;
const place=$("#task-place").value.trim();
if(!time||!place){toast("请填写完整");return}
tasks[i]={...t,time,place};
tasks.sort((a,b)=>a.time.localeCompare(b.time));
Store.set("todayTasks",tasks);
closeModal();rerender();toast("✅ 已保存");
};
},
deleteTask(i){
const tasks=Store.get("todayTasks");
const t=tasks[i];
confirmModal("删除行程",`确定删除「${t.time} ${t.place}」？`,()=>{
tasks.splice(i,1);
Store.set("todayTasks",tasks);
rerender();toast("已删除");
});
}
};

_xhsFilter:{cat:"",tag:"",sort:"new",q:""},
renderFavList(favs){
const f=this._xhsFilter;
let list=favs.slice();
if(f.cat)list=list.filter(x=>x.category===f.cat);
if(f.tag)list=list.filter(x=>(x.tags||[]).includes(f.tag));
if(f.q){const q=f.q.toLowerCase();list=list.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.description||"").toLowerCase().includes(q)||(x.tags||[]).some(t=>t.toLowerCase().includes(q))||(x.note||"").toLowerCase().includes(q))}
if(f.sort==="old")list.sort((a,b)=>a.id-b.id);
else if(f.sort==="title")list.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
else list.sort((a,b)=>b.id-a.id);
if(!list.length)return'<div class="empty">没有匹配的收藏</div>';
return list.map(x=>this.favCard(x)).join("");
},

const weekRecords=records.filter(r=>new Date(r.time)>=weekStart);

<span class="cat-tab active" onclick="Panels.douyin.filterCat('')">全部</span>
${cats.map(c=>`<span class="cat-tab" onclick="Panels.douyin.filterCat('${c.replace(/'/g,"\\'")}')">${c}</span>`).join("")}
<button class="cat-tab" style="background:var(--bg-light)" onclick="Panels.douyin.addCat()">➕</button>
<button class="cat-tab" style="background:var(--bg-light)" onclick="Panels.douyin.manageCats()">✏️</button>
</div>
</div>
${allTags.length?`<div class="tag-filter-bar" id="dy-tag-bar"><span class="tag-filter-chip active" onclick="Panels.douyin.filterTag('')">全部标签</span>${allTags.map(t=>`<span class="tag-filter-chip" onclick="Panels.douyin.filterTag('${t.replace(/'/g,"\\'")}')">${t}</span>`).join("")}</div>`:""}
<div class="sort-bar">
<select id="dy-sort" onchange="Panels.douyin.sortBy(this.value)">
<option value="new">最新添加</option>
<option value="old">最早添加</option>
<option value="title">按标题</option>
</select>
<input id="dy-search" placeholder="搜索标题/描述/标签..." style="flex:1;padding:6px 10px;font-size:12px" oninput="Panels.douyin.search()">
</div>
<div style="display:flex;gap:8px;margin-bottom:10px">
<button class="btn btn-sm btn-outline" style="flex:1" onclick="Panels.douyin.showBatchImport()">📥 批量导入</button>
<button class="btn btn-sm" style="flex:1" onclick="Panels.douyin.showAddForm()">➕ 单个添加</button>
</div>
<div id="dy-list">
${favs.length?this.renderList(favs):'<div class="empty">暂无收藏，点击 ➕ 添加或 📥 批量导入</div>'}
</div>
`;
},
renderList(favs){
const f=this._dyFilter;
let list=favs.slice();
if(f.cat)list=list.filter(x=>x.category===f.cat);
if(f.tag)list=list.filter(x=>(x.tags||[]).includes(f.tag));
if(f.q){const q=f.q.toLowerCase();list=list.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.description||"").toLowerCase().includes(q)||(x.tags||[]).some(t=>t.toLowerCase().includes(q))||(x.note||"").toLowerCase().includes(q))}
if(f.sort==="old")list.sort((a,b)=>a.id-b.id);
else if(f.sort==="title")list.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
else list.sort((a,b)=>b.id-a.id);
if(!list.length)return'<div class="empty">没有匹配的收藏</div>';
return list.map(x=>this.favCard(x)).join("");
},
favCard(f){
const tagsHtml=(f.tags||[]).map(t=>`<span class="fav-tag-chip">${t}</span>`).join("");
return`<div class="fav-card" data-cat="${f.category}" data-title="${(f.title||"").replace(/"/g,"&quot;")}" data-tags="${(f.tags||[]).join(",")}" data-desc="${(f.description||"").replace(/"/g,"&quot;")}" data-note="${(f.note||"").replace(/"/g,"&quot;")}" onclick="Panels.douyin.showDetail(${f.id})">
<div style="display:flex;align-items:flex-start;gap:8px">
<input type="checkbox" ${f.learned?"checked":""} onchange="event.stopPropagation();Panels.douyin.toggleLearn(${f.id})" style="flex-shrink:0;margin-top:2px">
<div style="flex:1;min-width:0">
<div class="fav-card-title">${f.title||"无标题"}</div>
<div class="fav-card-meta">@${f.author||"未知"} · ${f.category} · ${f.timeStr||""}</div>
${tagsHtml?`<div class="fav-tags-row">${tagsHtml}</div>`:""}
${f.summary?`<div class="fav-card-summary">${f.summary}</div>`:""}
${f.note?`<div style="font-size:11px;color:var(--accent);margin-top:4px">📝 ${f.note}</div>`:""}
</div>
</div>
</div>`;
},
showDetail(id){
const favs=Store.get("douyinFavorites");
const f=favs.find(x=>x.id===id);
if(!f)return;
const tagsHtml=(f.tags||[]).map(t=>`<span class="fav-tag-chip">${t}</span>`).join("");
showModal(`<div class="modal-title">📋 收藏详情</div>
<div class="fav-detail-row"><div class="fav-detail-label">标题</div><div class="fav-detail-value" style="font-weight:600">${f.title||"无标题"}</div></div>
<div class="fav-detail-row"><div class="fav-detail-label">作者</div><div class="fav-detail-value">@${f.author||"未知"}</div></div>
<div class="fav-detail-row"><div class="fav-detail-label">分类</div><div class="fav-detail-value">${f.category}</div></div>
<div class="fav-detail-row"><div class="fav-detail-label">添加时间</div><div class="fav-detail-value">${f.timeStr||""}</div></div>
${f.url?`<div class="fav-detail-row"><div class="fav-detail-label">链接</div><div class="fav-detail-value"><a href="${f.url}" target="_blank" style="color:var(--primary)">${f.url.slice(0,40)}...</a></div></div>`:""}
${f.description?`<div class="fav-detail-row"><div class="fav-detail-label">描述</div><div class="fav-detail-value">${f.description}</div></div>`:""}
${tagsHtml?`<div class="fav-detail-row"><div class="fav-detail-label">标签</div><div class="fav-detail-value"><div class="fav-tags-row">${tagsHtml}</div></div></div>`:""}
${f.summary?`<div class="fav-detail-row"><div class="fav-detail-label">摘要</div><div class="fav-detail-value" style="background:var(--bg-soft);padding:6px 8px;border-radius:8px">${f.summary}</div></div>`:""}
<div class="fav-detail-row"><div class="fav-detail-label">📝 备注</div><div class="fav-detail-value"><textarea id="dy-note" placeholder="添加你的笔记..." style="min-height:50px;font-size:12px">${(f.note||"").replace(/</g,"&lt;")}</textarea></div></div>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn btn-sm" style="flex:1" onclick="Panels.douyin.saveNote(${f.id})">💾 保存备注</button>
<button class="btn btn-sm btn-outline" style="flex:1" onclick="Panels.douyin.editFav(${f.id})">✏️ 编辑</button>
<button class="btn btn-sm btn-danger" style="flex:1" onclick="Panels.douyin.delFav(${f.id})">🗑 删除</button>
</div>`);
},
saveNote(id){
const favs=Store.get("douyinFavorites");
const f=favs.find(x=>x.id===id);
if(f){f.note=$("#dy-note").value.trim();Store.set("douyinFavorites",favs);toast("✅ 备注已保存")}
},
editFav(id){
const favs=Store.get("douyinFavorites");
const f=favs.find(x=>x.id===id);
if(!f)return;
const cats=Store.get("douyinCats");
showModal(`<div class="modal-title">✏️ 编辑收藏</div>
<div class="form-group"><label>标题</label><input id="ed-title" value="${(f.title||"").replace(/"/g,"&quot;")}"></div>
<div class="form-group"><label>作者</label><input id="ed-author" value="${f.author||""}"></div>
<div class="form-group"><label>链接</label><input id="ed-url" value="${f.url||""}"></div>
<div class="form-group"><label>描述</label><textarea id="ed-desc" style="min-height:50px">${(f.description||"").replace(/</g,"&lt;")}</textarea></div>
<div class="form-group"><label>标签（逗号分隔）</label><input id="ed-tags" value="${(f.tags||[]).join(", ")}"></div>
<div class="form-group"><label>分类</label><select id="ed-cat">${cats.map(c=>`<option ${c===f.category?"selected":""}>${c}</option>`).join("")}</select></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="ed-save">保存</button></div>`);
$("#ed-save").onclick=()=>{
f.title=$("#ed-title").value.trim();
f.author=$("#ed-author").value.trim();
f.url=$("#ed-url").value.trim();
f.description=$("#ed-desc").value.trim();
f.tags=$("#ed-tags").value.split(/[,，]/).map(t=>t.trim()).filter(t=>t);
f.category=$("#ed-cat").value;
const analysis=analyzeContent({title:f.title,description:f.description,tags:f.tags});
f.summary=analysis.summary;
Store.set("douyinFavorites",favs);
closeModal();rerender();toast("✅ 已更新");
};
},
showBatchImport(){
const cats=Store.get("douyinCats");
showModal(`<div class="modal-title">📥 批量导入抖音收藏</div>
<div class="form-group"><label>粘贴分享文本（每条一行）</label><textarea class="batch-area" id="batch-input" placeholder="将抖音「分享」按钮复制的文字粘贴到这里，每条一行。&#10;例如：&#10;5分钟学会AI绘画 #AI绘画 #教程 https://v.douyin.com/xxx/&#10;AI生成3D模型教程 #AI #3D建模 https://v.douyin.com/yyy/"></textarea></div>
<div class="form-group"><label>分类</label><select id="batch-cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select></div>
<button class="btn btn-sm btn-outline btn-block" id="batch-preview-btn" style="margin-bottom:10px">🔍 预览解析结果</button>
<div id="batch-preview"></div>
<div style="display:flex;gap:10px;margin-top:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="batch-import-btn">📥 导入</button></div>`);
$("#batch-preview-btn").onclick=()=>Panels.douyin.previewBatch();
$("#batch-import-btn").onclick=()=>Panels.douyin.doBatchImport();
},
previewBatch(){
const text=$("#batch-input").value.trim();
if(!text){toast("请先粘贴内容");return}
const cat=$("#batch-cat").value;
const items=batchParse(text,"douyin");
if(!items.length){toast("未解析到有效内容");return}
const html=items.map((it,i)=>`<div class="import-preview-item"><div class="ipt-title">${i+1}. ${it.title}</div><div class="ipt-meta">${it.tags.length?"标签: "+it.tags.join(", ")+" · ":""}${it.url?"有链接":"无链接"} · 摘要: ${it.summary.slice(0,30)}...</div></div>`).join("");
$("#batch-preview").innerHTML=`<div style="font-size:11px;color:var(--gray);margin-bottom:6px">解析到 ${items.length} 条，分类: ${cat}</div>${html}`;
},
doBatchImport(){
const text=$("#batch-input").value.trim();
if(!text){toast("请先粘贴内容");return}
const cat=$("#batch-cat").value;
const items=batchParse(text,"douyin");
if(!items.length){toast("未解析到有效内容");return}
const favs=Store.get("douyinFavorites");
let now=Date.now();
for(const it of items){
favs.unshift({id:now++,url:it.url,title:it.title,author:it.author||"",description:it.description,tags:it.tags,summary:it.summary,category:cat,note:"",learned:false,time:new Date().toISOString(),timeStr:fmtDateTime(new Date())});
}
Store.set("douyinFavorites",favs);
closeModal();rerender();toast("✅ 已导入 "+items.length+" 条收藏");
},
init(){
$("#global-fab").classList.add("hidden");
},
onLeave(){$("#global-fab").classList.add("hidden")},
filterCat(cat){
this._dyFilter.cat=cat;
$$(".cat-tab").forEach(t=>t.classList.remove("active"));
if(cat===""){$$(".cat-tab")[0].classList.add("active")}
else{$$(".cat-tab").forEach(t=>{if(t.textContent===cat)t.classList.add("active")})}
const favs=Store.get("douyinFavorites");
$("#dy-list").innerHTML=this.renderList(favs);
},
filterTag(tag){
this._dyFilter.tag=tag;
$$("#dy-tag-bar .tag-filter-chip").forEach(c=>c.classList.remove("active"));
if(tag===""){$$("#dy-tag-bar .tag-filter-chip")[0].classList.add("active")}
else{$$("#dy-tag-bar .tag-filter-chip").forEach(c=>{if(c.textContent===tag)c.classList.add("active")})}
const favs=Store.get("douyinFavorites");
$("#dy-list").innerHTML=this.renderList(favs);
},
sortBy(v){
this._dyFilter.sort=v;
const favs=Store.get("douyinFavorites");
$("#dy-list").innerHTML=this.renderList(favs);
},
search(){
this._dyFilter.q=$("#dy-search").value.toLowerCase();
const favs=Store.get("douyinFavorites");
$("#dy-list").innerHTML=this.renderList(favs);
},
showAddForm(){
const cats=Store.get("douyinCats");
showModal(`<div class="modal-title">➕ 添加收藏</div>
<div class="form-group"><label>视频链接 或 分享文本</label><textarea id="dy-link" placeholder="粘贴抖音分享文本或链接" style="min-height:50px"></textarea></div>
<div class="form-group"><label>来源博主</label><input id="dy-author" placeholder="@博主名"></div>
<div class="form-group"><label>分类</label><select id="dy-cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="dy-save">添加</button></div>`);
$("#dy-save").onclick=()=>{
const link=$("#dy-link").value.trim();
const author=$("#dy-author").value.trim();
const cat=$("#dy-cat").value;
if(!link){toast("请输入链接或标题");return}
const parsed=parseShareText(link,"douyin");
const analysis=analyzeContent(parsed);
const favs=Store.get("douyinFavorites");
const now=new Date();
favs.unshift({id:Date.now(),url:parsed.url,title:parsed.title,author,description:parsed.description,tags:parsed.tags,summary:analysis.summary,category:cat,note:"",learned:false,time:now.toISOString(),timeStr:fmtDateTime(now)});
Store.set("douyinFavorites",favs);
closeModal();rerender();toast("✅ 已添加收藏");
};
},
addCat(){
showModal(`<div class="modal-title">添加分类</div>
<div class="form-group"><input id="new-cat" placeholder="分类名称"></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="cat-save">添加</button></div>`);
$("#cat-save").onclick=()=>{
const v=$("#new-cat").value.trim();
if(!v){toast("请输入分类名");return}
const cats=Store.get("douyinCats");
if(!cats.includes(v)){cats.push(v);Store.set("douyinCats",cats)}
closeModal();rerender();
};
},
manageCats(){
const cats=Store.get("douyinCats");
const items=cats.map((c,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bg-light)">
<input id="cat-name-${i}" value="${c}" style="flex:1" onkeydown="if(event.key==='Enter')Panels.douyin.renameCat(${i},this.value)">
<button class="btn btn-sm" onclick="Panels.douyin.renameCat(${i},document.getElementById('cat-name-${i}').value)">保存</button>
<button class="btn btn-sm btn-danger" onclick="Panels.douyin.deleteCat('${c.replace(/'/g,"\\'")}')">删除</button>
</div>`).join("");
showModal(`<div class="modal-title">✏️ 管理分类</div>
<div style="max-height:300px;overflow-y:auto">${items}</div>
<div style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-gray btn-block" onclick="closeModal()">关闭</button></div>`);
},
renameCat(i,newName){
newName=newName.trim();
if(!newName){toast("分类名不能为空");return}
const cats=Store.get("douyinCats");
const oldName=cats[i];
if(oldName===newName){closeModal();return}
if(cats.includes(newName)){toast("分类名已存在");return}
cats[i]=newName;
Store.set("douyinCats",cats);
const favs=Store.get("douyinFavorites");
favs.forEach(f=>{if(f.category===oldName)f.category=newName});
Store.set("douyinFavorites",favs);
closeModal();rerender();toast("✅ 分类已重命名");
},
deleteCat(name){
const favs=Store.get("douyinFavorites");
if(favs.some(f=>f.category===name)){toast("该分类下还有收藏，请先移动或删除");return}
const cats=Store.get("douyinCats").filter(c=>c!==name);
Store.set("douyinCats",cats);
closeModal();rerender();toast("已删除分类");
},
toggleLearn(id){
const favs=Store.get("douyinFavorites");
const f=favs.find(x=>x.id===id);
if(f){f.learned=!f.learned;Store.set("douyinFavorites",favs)}
},
delFav(id){
confirmModal("删除收藏","确定删除？",()=>{
const favs=Store.get("douyinFavorites").filter(f=>f.id!==id);
Store.set("douyinFavorites",favs);closeModal();rerender();
});
}
};

// ---- 7. 学习成长 ----
Panels.learning={
render(){
const goals=Store.get("learningGoals");
const skills=Store.get("skills");
const records=Store.get("learningRecords");
const now=new Date();
const weekStart=new Date(now);weekStart.setDate(now.getDate()-now.getDay());weekStart.setHours(0,0,0,0);
const weekRecords=records.filter(r=>new Date(r.date)>=weekStart);
const totalMinutes=weekRecords.reduce((s,r)=>s+r.duration,0);
const hours=Math.floor(totalMinutes/60),mins=totalMinutes%60;
// countdown
let countdownHtml="";
if(goals.length){
const g=goals[0];
const target=new Date(g.targetDate);
const days=Math.ceil((target-now)/(86400000));
countdownHtml=`<div class="countdown-badge">⏳ 距离「${g.name}」还有 ${days} 天</div>`;
}else{
countdownHtml=`<div class="countdown-badge" style="opacity:.6">⏳ 暂无倒计时目标，请添加学习目标</div>`;
}
return`
${countdownHtml}
<div class="card" style="margin-top:10px">
<div class="card-title">🎯 学习目标</div>
${goals.length?goals.map(g=>`<div style="margin-bottom:10px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
<span style="font-size:13px;font-weight:600">${g.name}</span>
<button class="btn btn-sm btn-danger" onclick="Panels.learning.delGoal(${g.id})">🗑</button>
</div>
<div style="font-size:11px;color:var(--gray);margin-bottom:6px">开始：${g.startDate} | 目标：${g.targetDate}</div>
<div style="display:flex;align-items:center;gap:8px">
<div class="progress-bar" style="flex:1"><div class="fill" style="width:${g.progress}%"></div></div>
<span style="font-size:12px;font-weight:600">${g.progress}%</span>
<input type="range" min="0" max="100" value="${g.progress}" oninput="Panels.learning.updateProgress(${g.id},this.value)">
</div>
</div>`).join(""):"<div class='empty'>暂无目标</div>"}
<button class="btn btn-sm btn-outline btn-block" onclick="Panels.learning.addGoal()">➕ 添加目标</button>
</div>
<div class="card">
<div class="card-title">🌳 技能树</div>
${skills.length?skills.map(s=>`<div class="skill-item">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-size:13px;font-weight:600">${s.name}</span>
<button class="btn btn-sm btn-danger" onclick="Panels.learning.delSkill(${s.id})">🗑</button>
</div>
${s.subtasks.map((st,i)=>`<div class="subtask"><input type="checkbox" ${st.done?"checked":""} onchange="Panels.learning.toggleSubtask(${s.id},${i})"><span style="${st.done?"text-decoration:line-through;color:var(--gray)":""}">${st.name}</span></div>`).join("")}
<input style="margin-top:4px;font-size:12px" placeholder="+ 添加子任务" onkeydown="if(event.key==='Enter'&&this.value.trim())Panels.learning.addSubtask(${s.id},this.value)">
</div>`).join(""):"<div class='empty'>暂无技能</div>"}
<button class="btn btn-sm btn-outline btn-block" onclick="Panels.learning.addSkill()">➕ 添加技能</button>
</div>
<div class="card">
<div class="card-title">📝 今日学习记录</div>
<div class="form-group"><label>学习时长（分钟）</label><input id="lr-duration" type="number" placeholder="如：60"></div>
<div class="form-group"><label>学习内容简述</label><textarea id="lr-content" placeholder="今天学了什么..."></textarea></div>
<button class="btn btn-sm btn-block" onclick="Panels.learning.saveRecord()">💾 记录</button>
</div>
<div class="card">
<div class="card-title">📊 学习成果 <span style="font-size:12px;color:var(--gray);font-weight:400">本周累计 ${hours}h${mins}m</span></div>
${records.length?records.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--bg-light)">
<div style="display:flex;justify-content:space-between"><span style="font-size:12px;font-weight:600">${r.dateStr}</span><span class="tag tag-green">${r.duration}分钟</span></div>
<div style="font-size:12px;color:#555;margin-top:3px">${r.content}</div>
</div>`).join(""):"<div class='empty'>暂无记录</div>"}
</div>`;
},
init(){
$("#global-fab").classList.add("hidden");
},
onLeave(){$("#global-fab").classList.add("hidden")},
addGoal(){
const today=todayKey();
showModal(`<div class="modal-title">🎯 添加学习目标</div>
<div class="form-group"><label>目标名称</label><input id="g-name" placeholder="如：30天读完《认知觉醒》"></div>
<div class="form-group"><label>开始日期</label><input id="g-start" type="date" value="${today}"></div>
<div class="form-group"><label>目标日期</label><input id="g-target" type="date"></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="g-save">添加</button></div>`);
$("#g-save").onclick=()=>{
const name=$("#g-name").value.trim();
const target=$("#g-target").value;
if(!name||!target){toast("请填写完整");return}
const goals=Store.get("learningGoals");
goals.push({id:Date.now(),name,startDate:$("#g-start").value,targetDate:target,progress:0});
Store.set("learningGoals",goals);
closeModal();rerender();toast("✅ 目标已添加");
};
},
delGoal(id){
const goals=Store.get("learningGoals").filter(g=>g.id!==id);
Store.set("learningGoals",goals);rerender();
},
updateProgress(id,val){

//==================== REMINDERS ====================
function checkReminders(){
const now=new Date();
const h=now.getHours(),m=now.getMinutes();
const timeStr=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
// Water reminder
if(h>=9&&h<21&&m%30===0){
const key=`water_${todayKey()}_${h}_${m}`;
if(!Store.get("reminder_"+key)){
notify("💧 该喝水啦！","保持水分摄入，健康每一天～");
Store.set("reminder_"+key,true);
}
}
// Task reminders
const tasks=Store.get("todayTasks");
let changed=false;
tasks.forEach(t=>{
if(t.time===timeStr&&!t.done&&!t.reminded){
notify("⏰ 任务提醒",t.place);
t.reminded=true;changed=true;
}
});
if(changed)Store.set("todayTasks",tasks);
// XHS publish reminders
const notes=Store.get("xhsNotes");
let nChanged=false;
notes.forEach(n=>{
if(n.publishTime){
const pt=n.publishTime.replace("T"," ").substring(0,5);
if(pt===timeStr&&n.status==="待发"&&!n.publishReminded){
notify("📢 发布提醒",`《${n.title}》计划发布时间到了！`);
n.publishReminded=true;nChanged=true;
}
}
});
if(nChanged)Store.set("xhsNotes",notes);
}

//==================== AI HOT AUTO REFRESH ====================
function checkAIAutoRefresh(){
const s=Store.get("settings");
if(!s.hotPush)return;
const freq=s.topicFreq;
if(freq==="manual")return;
const ai=Store.data.aiData;
if(!ai)return;
const lastRefresh=ai.date?new Date(ai.date):new Date(0);
const now=new Date();
const diff=now-lastRefresh;
if(freq==="daily"&&diff>86400000){
generateAIData();rerender();
}else if(freq==="6h"&&diff>21600000){
generateAIData();rerender();
}
}

//==================== INIT ====================
function init(){
Store.init();
if(Store.get("sidebar_hidden")){
$("#app").classList.add("sidebar-hidden");
$(".sidebar-toggle").textContent="☰";
}
renderSidebar();
rerender();
// Request notification permission
if("Notification"in window&&Notification.permission==="default"){
Notification.requestPermission();
}
// Start reminder timer
setInterval(checkReminders,60000);
// Start AI auto refresh checker
setInterval(checkAIAutoRefresh,600000);
// Screen always on
const s=Store.get("settings");
if(s.screenOn&&"wakeLock"in navigator){
navigator.wakeLock.request("screen").catch(()=>{});
}
}
document.addEventListener("DOMContentLoaded",init);
// Prevent modal close on tap outside content
$("#modal-overlay").addEventListener("click",e=>{if(e.target.id==="modal-overlay")closeModal()});
</script>
</body>
</html>
