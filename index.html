<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <title>Liewkay's Workbench</title>
  <meta name="description" content="Liewkay 的个人工作台：待办、笔记、习惯、目标、阅读追剧与数据总览，一处收拢。" />
  <meta name="theme-color" content="#f4f4f5" />
  <meta name="color-scheme" content="light dark" />

  <!-- PWA -->
  <link rel="manifest" href="/workbench/manifest.webmanifest" />
  <link rel="icon" href="/workbench/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/workbench/icons/icon-180.png" />

  <!-- iOS 全屏与状态栏 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Workbench" />
  <meta name="format-detection" content="telephone=no" />

  <style>
    /* 挂载前的骨架，避免白屏跳变 */
    html, body { margin: 0; padding: 0; height: 100%; background: #fafafa; }
    html[data-theme='dark'], html[data-theme='dark'] body { background: #0b0b0e; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0;
      font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px; color: #8b8b96; letter-spacing: 0.01em;
    }
    html[data-theme='dark'] #boot { color: #6e6e7a; }
    #boot .mark {
      width: 46px; height: 46px; border-radius: 13px; margin-bottom: 16px;
      background: linear-gradient(135deg, #6d75dd, #575fc4); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: ui-monospace, 'SF Mono', Consolas, monospace;
      font-weight: 700; font-size: 19px; letter-spacing: -0.5px;
      box-shadow: 0 6px 20px rgba(94, 106, 210, 0.4);
    }
    #boot .bar {
      margin-top: 20px; width: 148px; height: 3px; border-radius: 999px;
      background: #e3e3e8; overflow: hidden; position: relative;
    }
    html[data-theme='dark'] #boot .bar { background: #212129; }
    #boot .bar i {
      position: absolute; top: 0; bottom: 0; width: 44%;
      border-radius: 999px; background: #5e6ad2;
      animation: bkslide 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes bkslide {
      0% { left: -44%; }
      55% { left: 100%; }
      100% { left: 100%; }
    }
  </style>
  <script type="module" crossorigin src="/workbench/assets/index-DIVjjfwm.js"></script>
  <link rel="modulepreload" crossorigin href="/workbench/assets/vendor-react-ChlcLHLZ.js">
  <link rel="modulepreload" crossorigin href="/workbench/assets/vendor-supabase-COVBLFVx.js">
  <link rel="stylesheet" crossorigin href="/workbench/assets/style-qIAs36SF.css">
</head>
<body>
  <div id="root"></div>
  <div id="boot">
    <div class="mark">LW</div>
    <div>Liewkay's Workbench</div>
    <div class="bar"><i></i></div>
  </div>
  <noscript>
    <div style="padding:32px;font-family:system-ui,sans-serif">
      需要启用 JavaScript 才能运行 Liewkay's Workbench。
    </div>
  </noscript>
</body>
</html>
