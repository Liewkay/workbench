<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">
<title>工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
/* 身份色：Jane 紫粉（治愈系） */
--primary:#6366f1;--primary-600:#4f46e5;--primary-dark:#4338ca;
--primary-50:#eef2ff;--primary-100:#e0e7ff;--primary-200:#c7d2fe;
--accent:#ec4899;--accent-600:#db2777;--accent-dark:#be185d;
--accent-50:#fdf2f8;--accent-100:#fce7f3;--accent-200:#fbcfe8;
--violet:#8b5cf6;--violet-50:#f5f3ff;--violet-100:#ede9fe;
--magenta:#d946ef;
--mint:#10b981;--mint-50:#ecfdf5;--mint-100:#d1fae5;
--sky:#0ea5e9;--sky-50:#f0f9ff;--sky-100:#e0f2fe;
--coral:#fb7185;--coral-50:#fff1f2;
--orange:#f97316;--orange-50:#fff7ed;--orange-100:#ffedd5;
/* 表面与背景（Jane 浅薰衣草） */
--bg:#f5f3ff;--bg-soft:#ede9fe;--bg-pink:#fdf4ff;
--surface:#ffffff;--surface-2:#faf7ff;--surface-3:#f3f0ff;
/* 边框 */
--border:#ede9fe;--border-strong:#ddd6fe;--border-soft:rgba(99,102,241,.08);
/* 文本 */
--text-1:#1e1b4b;--text-2:#4c1d95;--text-3:#7c3aed;--text-muted:#6b7280;
/* 兼容 */
--bg-light:#f5f3ff;--bg-red:#fdf2f8;--text-dark:#1e1b4b;
--card-bg:#ffffff;--highlight:#ede9fe;--highlight-red:#fce7f3;
--gray:#6b7280;--light-gray:#f3f0ff;--red:#ec4899;
/* 圆角 */
--r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;--r-pill:999px;
/* 间距 */
--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
/* 字阶 */
--fs-xs:11px;--fs-sm:12px;--fs-md:14px;--fs-lg:16px;--fs-xl:18px;--fs-2xl:22px;--fs-display:32px;
/* 阴影（柔） */
--shadow-1:0 1px 2px rgba(99,102,241,.04);
--shadow-2:0 4px 14px rgba(99,102,241,.06),0 1px 3px rgba(99,102,241,.04);
--shadow-3:0 12px 32px rgba(99,102,241,.10);
--shadow:var(--shadow-2);
/* 玻璃 */
--glass:rgba(255,255,255,.78);--glass-border:rgba(255,255,255,.6);
/* 渐变 */
--grad-primary:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#ec4899 100%);
--grad-violet:linear-gradient(135deg,#a78bfa 0%,#6366f1 100%);
--grad-pink:linear-gradient(135deg,#f472b6 0%,#a78bfa 100%);
--grad-soft:linear-gradient(135deg,#f5f3ff 0%,#fdf2f8 100%);
--grad-hero:linear-gradient(135deg,#7c3aed 0%,#c026d3 50%,#ec4899 100%);
/* 平台胶囊色（真实品牌色） */
--plat-dy:#000000;
--plat-xhs:#e11d48;--plat-xhs-bg:#fff1f2;--plat-xhs-bd:#fecdd3;
--plat-bili:#1d4ed8;--plat-bili-bg:#e0f2fe;--plat-bili-bd:#bae6fd;
--plat-ks:#ea580c;--plat-ks-bg:#fff7ed;--plat-ks-bd:#fed7aa;
--plat-wx:#16a34a;--plat-wx-bg:#f0fdf4;--plat-wx-bd:#bbf7d0;
--plat-db:#16a34a;--plat-db-bg:#ecfdf5;--plat-db-bd:#a7f3d0;
--plat-xmly:#ea580c;--plat-xmly-bg:#fff7ed;--plat-xmly-bd:#fed7aa;
}
html,body{height:100%;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;color:var(--text-dark);background:var(--bg);touch-action:manipulation}
body{overflow-y:auto}

/* ============== 顶部 AppBar（Jane 风格） ============== */
.app-bar{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:10px;padding:0 12px;padding-top:env(safe-area-inset-top);background:var(--bg);z-index:50}
.app-bar-menu{width:36px;height:36px;border-radius:12px;background:var(--primary-50);color:var(--primary-dark);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.app-bar-menu:active{transform:scale(.92)}
.app-bar-title{font-size:17px;font-weight:800;color:var(--primary-dark);letter-spacing:.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-bar-date{font-size:13px;color:var(--text-1);font-weight:600;margin-right:6px;display:flex;align-items:center;gap:4px}
.app-bar-home{width:42px;height:36px;border-radius:14px;background:linear-gradient(135deg,#fce7f3,#ede9fe);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.app-bar-home:active{transform:scale(.92)}

/* ============== 底部 TabBar ============== */
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:60px;padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:40}
.tab-bar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--text-muted);cursor:pointer;transition:all .2s;border:none;background:none;padding:6px 2px;font-weight:600}
.tab-bar-item .tab-icon{font-size:22px;line-height:1;transition:transform .2s}
.tab-bar-item.active{color:var(--primary-dark)}
.tab-bar-item.active .tab-icon{transform:scale(1.08)}
.tab-bar-item:active{transform:scale(.94)}
.tab-bar-item.tab-home.active .tab-icon{color:#16a34a}
.tab-bar-item.tab-plan.active .tab-icon{color:#10b981}
.tab-bar-item.tab-idea.active .tab-icon{color:#f59e0b}
.tab-bar-item.tab-fit.active .tab-icon{color:#ec4899}
.tab-bar-item.tab-all.active .tab-icon{color:var(--primary-dark)}

/* ============== 主区滚动容器 ============== */
#app{display:flex;height:100%;height:100dvh;position:relative;padding-top:54px;padding-bottom:60px}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 24px;background:transparent}
.panel{display:none;animation:fadeIn .25s ease}
.panel.active{display:block}
.panel{max-width:560px;margin:0 auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ============== 抽屉 Drawer（Jane 风格：分组+图标盒+active 渐变） ============== */
#sidebar{position:fixed;top:0;left:0;height:100%;height:100dvh;width:80%;max-width:320px;background:linear-gradient(180deg,#faf7ff 0%,#f5f3ff 100%);z-index:200;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding-top:env(safe-area-inset-top);border-radius:0 24px 24px 0;box-shadow:0 24px 60px rgba(99,102,241,.16)}
#app.sidebar-open #sidebar{transform:translateX(0)}
#sidebar-overlay{display:block;position:fixed;inset:0;background:rgba(99,102,241,.20);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:199;opacity:0;pointer-events:none;transition:opacity .25s}
#app.sidebar-open #sidebar-overlay{opacity:1;pointer-events:auto}
.drawer-header{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.drawer-header .drawer-menu-btn{width:36px;height:36px;border-radius:12px;background:var(--primary-50);color:var(--primary-dark);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drawer-header .drawer-title{font-size:15px;font-weight:800;color:var(--primary-dark);letter-spacing:.5px}
.drawer-section{padding:14px 14px 4px}
.drawer-section:first-of-type{padding-top:6px}
.drawer-section-title{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;margin:4px 8px 6px;text-transform:uppercase;opacity:.85}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;cursor:pointer;transition:all .2s;border:none;background:none;font-size:13px;color:var(--text-1);width:100%;text-align:left;margin:2px 0;font-weight:600}
.nav-item:active{transform:scale(.98)}
.nav-item .nav-icon-box{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--primary-50);transition:all .2s}
.nav-item.active{background:var(--grad-primary);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.30)}
.nav-item.active .nav-icon-box{background:rgba(255,255,255,.25);color:#fff;box-shadow:none}
.drawer-sync{padding:14px 14px 22px}
.drawer-sync .btn{width:100%;font-size:13px;padding:11px 14px}

/* ============== 卡片 ============== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-1)}
.card:hover{box-shadow:var(--shadow-2)}
.card-title{font-size:15px;font-weight:800;color:var(--text-1);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .emoji{font-size:18px}
.section-title{font-size:14px;font-weight:800;color:var(--text-1);margin:18px 4px 10px;display:flex;align-items:center;gap:6px}
.section-subtitle{font-size:12px;color:var(--text-muted);margin:-6px 4px 12px;font-weight:500}
.divider-soft{height:1px;background:var(--border);margin:14px -16px}

/* ============== 按钮 ============== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 20px;border-radius:var(--r-pill);border:none;font-size:13px;cursor:pointer;transition:all .2s;background:var(--grad-primary);color:#fff;font-weight:700;box-shadow:0 3px 10px rgba(99,102,241,.25)}
.btn:active{transform:scale(.96)}
.btn-sm{padding:6px 14px;font-size:11px}
.btn-block{width:100%;padding:13px;font-size:14px}
.btn-outline{background:var(--surface);color:var(--primary);border:1px solid var(--primary);box-shadow:none}
.btn-outline:hover{background:var(--primary-50)}
.btn-soft{background:var(--primary-50);color:var(--primary-dark);box-shadow:none}
.btn-danger{background:linear-gradient(135deg,#fb7185 0%,#ec4899 100%);box-shadow:0 3px 10px rgba(236,72,153,.25)}
.btn-gray{background:var(--surface-2);color:var(--text-2);box-shadow:none}

/* ============== 表单 ============== */
input,textarea,select{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:14px;font-size:13px;background:var(--surface-2);color:var(--text-dark);font-family:inherit;outline:none;transition:all .2s}
input:focus,textarea:focus,select:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px rgba(99,102,241,.10)}
textarea{resize:vertical;min-height:60px}
label{font-size:12px;color:var(--gray);display:block;margin-bottom:4px;font-weight:600}

/* ============== 通用标签 ============== */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.3px}
.tag-green{background:var(--mint-50);color:#047857}
.tag-gray{background:var(--surface-3);color:var(--text-3)}
.tag-orange{background:var(--orange-50);color:#ea580c}
.tag-red{background:var(--coral-50);color:var(--accent-dark)}
.tag-purple{background:var(--violet-50);color:var(--primary-dark)}
.tag-pink{background:var(--accent-100);color:var(--accent-dark)}
.tag-sky{background:var(--sky-50);color:#0369a1}

/* ============== 平台胶囊（Jane 真实品牌色） ============== */
.platform-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:var(--r-pill);font-size:11px;font-weight:700;border:1px solid transparent;line-height:1.4;white-space:nowrap}
.platform-chip .pc-icon{font-size:11px}
.platform-chip.dy{background:#000;color:#fff}
.platform-chip.dy-follow{background:#000;color:#fff}
.platform-chip.xhs{background:var(--plat-xhs-bg);color:var(--plat-xhs);border-color:var(--plat-xhs-bd)}
.platform-chip.bili{background:var(--plat-bili-bg);color:var(--plat-bili);border-color:var(--plat-bili-bd)}
.platform-chip.ks{background:var(--plat-ks-bg);color:var(--plat-ks);border-color:var(--plat-ks-bd)}
.platform-chip.wx-book{background:var(--plat-wx-bg);color:var(--plat-wx);border-color:var(--plat-wx-bd)}
.platform-chip.xmly{background:var(--plat-xmly-bg);color:var(--plat-xmly);border-color:var(--plat-xmly-bd)}
.platform-chip.douban{background:var(--plat-db-bg);color:var(--plat-db);border-color:var(--plat-db-bd)}

/* ============== 分类胶囊 ============== */
.cat-pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.3px}
.cat-pill.fitness{background:var(--mint-50);color:#047857}
.cat-pill.tech{background:var(--sky-50);color:#0369a1}
.cat-pill.food{background:var(--orange-50);color:#ea580c}
.cat-pill.lifestyle{background:var(--accent-100);color:var(--accent-dark)}
.cat-pill.study{background:var(--violet-50);color:var(--primary-dark)}
.cat-pill.work{background:var(--surface-3);color:var(--text-2)}
.cat-pill.active{background:var(--grad-primary);color:#fff;box-shadow:0 2px 6px rgba(99,102,241,.30)}

/* ============== 优先级胶囊 ============== */
.priority-tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:var(--r-pill);font-size:10px;font-weight:700;letter-spacing:.3px}
.priority-tag.low{background:var(--sky-50);color:#0369a1}
.priority-tag.med{background:var(--violet-50);color:var(--primary-dark)}
.priority-tag.high{background:var(--accent-100);color:var(--accent-dark)}

/* ============== 横幅 banner ============== */
.banner-pink{background:var(--grad-pink);color:var(--accent-dark);border-radius:var(--r-lg);padding:14px 16px;font-size:13px;font-weight:700;border:1px solid rgba(236,72,153,.12);box-shadow:var(--shadow-1)}
.banner-violet{background:var(--grad-violet);color:#fff;border-radius:var(--r-lg);padding:14px 16px;font-size:13px;font-weight:700;border:1px solid rgba(124,58,237,.10);box-shadow:var(--shadow-1)}
.banner-soft{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;font-size:13px;font-weight:600;border:1px solid var(--border);box-shadow:var(--shadow-1)}

/* ============== 列表行（Jane 待办风格） ============== */
.list-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--border)}
.list-row:last-child{border-bottom:none}
.list-row .checkbox{width:20px;height:20px;border:2px solid var(--border-strong);border-radius:50%;flex-shrink:0;background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.list-row .checkbox.checked{background:var(--grad-primary);border-color:transparent;color:#fff;font-size:12px}
.divider-dashed{border:none;border-top:1px dashed var(--border);margin:6px 0}

/* ============== 状态点 ============== */
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.done{background:var(--mint)}
.status-dot.pending{background:var(--orange)}
.status-dot.todo{background:var(--border-strong)}

/* ============== 日历（Jane 白方块） ============== */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.calendar .cal-header{font-size:11px;color:var(--text-muted);padding:6px 0;font-weight:700}
.calendar .cal-day{aspect-ratio:1/1;max-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;border-radius:14px;cursor:pointer;line-height:1.1;background:var(--surface-2);color:var(--text-1);font-weight:600;border:1px solid var(--border);transition:all .2s}
.calendar .cal-day .lunar{font-size:9px;color:var(--text-muted);margin-top:1px;font-weight:500}
.calendar .cal-day.today{background:var(--grad-primary);color:#fff;font-weight:800;border-color:transparent;box-shadow:0 4px 10px rgba(99,102,241,.30)}
.calendar .cal-day.today .lunar{color:rgba(255,255,255,.85)}
.calendar .cal-day.selected{outline:2px solid var(--primary);outline-offset:-2px}
.calendar .cal-day.other{color:var(--text-3);opacity:.4}
.calendar .cal-day:active{transform:scale(.94)}

/* ============== 进度条 / 进度环 ============== */
.progress-bar{height:8px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.progress-bar .fill{height:100%;background:var(--grad-primary);border-radius:5px;transition:width .3s}
.progress-ring{width:84px;height:84px;position:relative;flex-shrink:0}
.progress-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.progress-ring .ring-bg{fill:none;stroke:rgba(255,255,255,.25);stroke-width:8}
.progress-ring .ring-fg{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s}
.progress-ring .ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px}
.progress-ring.compact{width:54px;height:54px}
.progress-ring.compact .ring-bg,.progress-ring.compact .ring-fg{stroke-width:6}
.progress-ring.compact .ring-text{font-size:14px}

/* ============== 复选框/开关 ============== */
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}
.toggle{position:relative;width:46px;height:26px;background:var(--border-strong);border-radius:13px;cursor:pointer;transition:all .2s;flex-shrink:0}
.toggle.on{background:var(--grad-primary)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:all .2s}
.toggle.on::after{left:22px}

/* ============== 设置行 ============== */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);gap:10px}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:13px;font-weight:700;flex:1;min-width:0}
.setting-desc{font-size:11px;color:var(--gray);margin-top:3px;line-height:1.5}
.switch-row{display:flex;align-items:center;gap:10px}

/* ============== 任务 ============== */
.task-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;margin-bottom:6px;background:var(--surface-2);transition:all .2s;border:1px solid transparent}
.task-item.done{opacity:.55}
.task-item.done .task-text{text-decoration:line-through;color:var(--gray)}
.task-time{font-size:12px;font-weight:800;color:var(--primary-dark);min-width:38px}
.task-text{font-size:13px;flex:1}
.task-item.hotspot-item{background:linear-gradient(135deg,var(--orange-50),var(--coral-50));border:1px dashed var(--orange)}
.task-action-btn{width:28px;height:28px;border-radius:8px;border:none;background:transparent;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.5;color:var(--text-3)}
.task-action-btn:active{transform:scale(.9);background:var(--bg);opacity:1}

/* ============== 产品卡 / 笔记卡 / 收藏 ============== */
.product-card{position:relative;overflow:hidden;background:#fff;border-radius:var(--r-md);padding:10px;margin-bottom:8px;box-shadow:var(--shadow-1);display:flex;gap:10px}
.product-card .swipe-content{display:flex;gap:10px;width:100%;transition:transform .2s}
.product-card .swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex}
.product-card .swipe-actions button{width:64px;border:none;font-size:11px;color:#fff;cursor:pointer}
.product-thumb{width:54px;height:54px;border-radius:var(--r-sm);object-fit:cover;background:var(--surface-3);flex-shrink:0}
.product-info{flex:1;min-width:0}
.product-title{font-size:13px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.product-price{color:var(--accent);font-weight:800;font-size:14px}
.xhs-note{background:var(--surface);border-radius:var(--r-md);padding:10px;margin-bottom:8px;box-shadow:var(--shadow-1);display:flex;gap:10px;border:1px solid var(--border)}
.xhs-cover{width:50px;height:50px;border-radius:var(--r-sm);background:var(--primary-50);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.news-item{padding:10px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-title{font-size:13px;font-weight:700;margin-bottom:4px}
.news-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--gray)}
.heat{color:var(--orange);font-weight:700}
.suggestion-item{background:var(--surface-2);border-radius:var(--r-md);padding:10px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px dashed var(--border)}
.suggestion-text{font-size:12px;flex:1;line-height:1.5}
.diet-record{display:flex;gap:10px;padding:8px;border-radius:var(--r-sm);background:var(--surface-2);margin-bottom:6px;align-items:center}

.subtask{display:flex;align-items:center;gap:8px;padding:6px 0 6px 12px;font-size:12px}
.review-history-item{padding:10px;border-radius:var(--r-md);background:var(--surface-2);margin-bottom:6px;cursor:pointer;border:1px solid var(--border)}
.review-detail{display:none;margin-top:8px;font-size:12px;line-height:1.6;color:var(--text-2)}
.review-detail.show{display:block}

.stat-capsule{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.mood-btn{font-size:24px;cursor:pointer;padding:8px;border-radius:10px;transition:all .2s}
.mood-btn.selected{background:var(--primary-50);box-shadow:inset 0 0 0 1px var(--primary)}
.mood-btn:active{transform:scale(.9)}
.cat-tab{padding:5px 14px;border-radius:var(--r-pill);font-size:11px;cursor:pointer;white-space:nowrap;transition:all .2s;background:var(--surface-2);color:var(--text-2)}
.cat-tab.active{background:var(--grad-primary);color:#fff;box-shadow:0 2px 6px rgba(99,102,241,.30)}
.hidden{display:none!important}
.empty{text-align:center;padding:30px 10px;color:var(--gray);font-size:13px}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.countdown-badge{background:var(--grad-primary);color:#fff;padding:10px 14px;border-radius:var(--r-md);text-align:center;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(99,102,241,.25)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--violet);border-radius:4px;opacity:.4}
::-webkit-scrollbar-track{background:transparent}

/* ============== 收藏卡 ============== */
.fav-card{background:var(--surface);border-radius:var(--r-md);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-1);transition:all .2s;cursor:pointer;border:1px solid var(--border)}
.fav-card:active{transform:scale(.98)}
.fav-card-title{font-size:13px;font-weight:700;color:var(--text-1);margin-bottom:4px;line-height:1.4}
.fav-card-meta{font-size:11px;color:var(--text-3);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fav-card-summary{font-size:11px;color:var(--text-2);line-height:1.5;margin-bottom:6px;background:var(--surface-2);padding:6px 8px;border-radius:var(--r-sm)}
.fav-tags-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.fav-tag-chip{padding:2px 8px;border-radius:var(--r-pill);font-size:10px;font-weight:700;background:var(--primary-50);color:var(--primary-dark)}
.fav-keyword-chip{padding:2px 8px;border-radius:var(--r-pill);font-size:10px;font-weight:700;background:var(--accent-100);color:var(--accent-dark)}
.fav-actions{display:flex;gap:4px;align-items:center;margin-top:6px}
.fav-detail-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.fav-detail-label{font-size:11px;font-weight:700;color:var(--text-3);min-width:56px;flex-shrink:0;padding-top:2px}
.fav-detail-value{font-size:12px;color:var(--text-dark);flex:1;min-width:0;word-break:break-all}
.batch-area{width:100%;min-height:120px;padding:12px;border:1px solid var(--border);border-radius:14px;font-size:12px;background:var(--surface-2);font-family:inherit;outline:none;resize:vertical;transition:all .2s}
.batch-area:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px rgba(99,102,241,.10)}
.import-preview-item{padding:8px 10px;border-radius:var(--r-sm);background:var(--surface-2);margin-bottom:6px;font-size:12px;border:1px solid var(--border)}
.import-preview-item .ipt-title{font-weight:700;margin-bottom:2px;color:var(--text-1)}
.import-preview-item .ipt-meta{font-size:10px;color:var(--text-3)}
.tag-filter-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tag-filter-chip{padding:4px 12px;border-radius:var(--r-pill);font-size:10px;cursor:pointer;background:var(--surface-2);color:var(--text-3);transition:all .2s;white-space:nowrap;border:1px solid var(--border)}
.tag-filter-chip.active{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 2px 6px rgba(99,102,241,.30)}
.sort-bar{display:flex;gap:6px;align-items:center;margin-bottom:8px;font-size:11px}
.sort-bar select{width:auto;padding:4px 8px;font-size:11px}

/* ============== Range Slider ============== */
input[type="range"]{-webkit-appearance:none;-moz-appearance:none;appearance:none;width:72px;height:20px;background:transparent;outline:none;margin:0;padding:0;cursor:pointer}
input[type="range"]::-webkit-slider-runnable-track{height:8px;background:var(--surface-2);border-radius:4px;border:1px solid var(--border)}
input[type="range"]::-moz-range-track{height:8px;background:var(--surface-2);border-radius:4px;border:1px solid var(--border)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--grad-primary);margin-top:-7px;cursor:pointer;border:2px solid #fff;box-shadow:0 2px 6px rgba(99,102,241,.40)}
input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer;border:2px solid #fff;box-shadow:0 2px 6px rgba(99,102,241,.40)}

/* ============== 浮按 ============== */
.fab{position:fixed;right:16px;bottom:74px;width:54px;height:54px;border-radius:50%;background:var(--grad-primary);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(99,102,241,.40);cursor:pointer;z-index:50;border:none}
.fab:active{transform:scale(.9)}

/* ============== Toast / Modal ============== */
#toast-container{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none}
.toast{background:rgba(30,27,75,.85);color:#fff;padding:10px 20px;border-radius:14px;font-size:13px;margin-bottom:8px;animation:toastIn .3s;white-space:nowrap;backdrop-filter:blur(8px)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1}}
#modal-overlay{position:fixed;inset:0;background:rgba(99,102,241,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
#modal-overlay.show{display:flex}
#modal-content{background:#fff;border-radius:18px;padding:20px;max-width:400px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-3)}
.modal-title{font-size:16px;font-weight:800;margin-bottom:14px;text-align:center;color:var(--text-1)}
.form-group{margin-bottom:12px}

/* ============== 总览 Hero（Jane 风：浅紫白底+圆环） ============== */
.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.18) 0%,transparent 70%);filter:blur(10px);pointer-events:none}
.hero::after{content:'';position:absolute;left:-30px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.18) 0%,transparent 70%);filter:blur(10px);pointer-events:none}
.hero-greeting{font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.5px;position:relative}
.hero-title{font-size:16px;font-weight:800;color:var(--text-1);margin-top:4px;position:relative;line-height:1.4}
.hero-stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;position:relative}
.hero-sync{margin-top:14px;display:flex;justify-content:flex-end;position:relative}

/* ============== Hero 渐变卡（用于私厨/灵感 等） ============== */
.hero-gradient{background:var(--grad-hero);color:#fff;border-radius:var(--r-xl);padding:18px;box-shadow:0 12px 30px rgba(124,58,237,.30);position:relative;overflow:hidden}
.hero-gradient::before{content:'';position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.18);filter:blur(8px);pointer-events:none}
.hero-gradient .hg-title{font-size:16px;font-weight:800;letter-spacing:.3px;position:relative}
.hero-gradient .hg-sub{font-size:12px;opacity:.92;margin-top:4px;position:relative}
.hero-gradient .hg-list{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative}
.hero-gradient .hg-list-item{font-size:12px;line-height:1.6;opacity:.95}
.hero-gradient .hg-platforms{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;position:relative}

.hero-gradient .platform-chip.xhs,
.hero-gradient .platform-chip.bili,

.stat-label{font-size:11px;color:var(--text-2);margin-top:4px;font-weight:600}

.app-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);cursor:pointer;transition:all .2s;text-decoration:none;color:inherit}

.app-tile .app-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface);border:1px solid var(--border)}
.app-tile .app-name{font-size:11px;color:var(--text-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}

.app-tile:hover .app-del,.app-tile:active .app-del{opacity:1}
.app-add{gap:6px;color:var(--text-3);font-size:11px}
.app-add .app-icon{background:var(--surface-2);border:1px dashed var(--border-strong);font-size:20px}

.idea-card-title{font-size:14px;font-weight:800;color:var(--text-1);line-height:1.4}
.idea-card-meta{margin-top:6px;font-size:12px;color:var(--text-2);line-height:1.5}
.idea-card-meta .idea-tip{color:var(--primary-dark);font-weight:700}
.idea-card-trend{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:var(--r-pill);font-size:10px;font-weight:700}
.idea-card-trend.up{background:var(--mint-50);color:#047857}
.idea-card-trend.hot{background:var(--orange-50);color:#ea580c}
.idea-card-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}

/* ============== 步骤列表（圆圈编号） ============== */
.steps{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.step{display:flex;gap:8px;font-size:12px;line-height:1.6;color:var(--text-1)}
.step .step-no{width:18px;height:18px;border-radius:50%;background:var(--primary-50);color:var(--primary-dark);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}

/* ============== 段标签（小节标号） ============== */
.section-badge{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--text-1);margin:18px 4px 8px}
.section-badge .badge-num{width:24px;height:24px;border-radius:8px;background:var(--grad-primary);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.section-badge .badge-tag{margin-left:auto;background:var(--accent-100);color:var(--accent-dark);padding:2px 10px;border-radius:var(--r-pill);font-size:10px;font-weight:700}

/* ============== 媒体类型标签 ============== */
.source-tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;background:var(--primary-50);color:var(--primary-dark)}

.source-tag.media{background:var(--accent-100);color:var(--accent-dark)}

.tab-bar-item .tab-icon{font-size:18px}
}

function _lYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(LUNAR_INFO[y-1900]&i)?1:0;return s+_lLeapDays(y)}
function _lLeapDays(y){const m=_lLeapMonth(y);return m?(LUNAR_INFO[y-1900]&0x10000)?30:29:0}
function _lLeapMonth(y){return LUNAR_INFO[y-1900]&0xf}
function _lMonthDays(y,m){return(LUNAR_INFO[y-1900]&(0x10000>>m))?30:29}
function _toLunar(d){
let base=new Date(1900,0,31);let offset=Math.floor((d-base)/86400000);
let y=1900;for(;y<2101&&offset>0;y++){offset-=_lYearDays(y)}
if(offset<0){offset+=_lYearDays(y-1);y--}
let leap=_lLeapMonth(y),isLeap=false,month=1;
for(;month<13&&offset>0;month++){
let days;if(isLeap&&month===(leap+1)){isLeap=false;month--}
if(month===(leap+1)&&!isLeap){isLeap=true;days=_lLeapDays(y)}else{days=_lMonthDays(y,month)}
offset-=days;if(isLeap&&month===leap){isLeap=false}
}
if(offset===0&&leap>0&&month===leap+1){if(isLeap){isLeap=false}else{isLeap=true;month--}}
if(offset<0){offset+=_lMonthDays(y,--month)}
return{y:y,m:month,d:offset+1,leap:isLeap}
}

const l=_toLunar(d);
if(l.d===1)return(l.leap?"闰":"")+_lunarMonths[l.m-1]+"月";

}
function dailySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function seededPick(arr,n,seed){
const r=[];const u=new Set();let s=seed||dailySeed();
while(r.length<n&&r.length<arr.length){s=(s*9301+49297)%233280;const i=Math.floor(s/233280*arr.length);if(!u.has(i)){u.add(i);r.push(arr[i])}}
return r;
}

function resizeImage(file,maxSize,cb){
const r=new FileReader();
r.onload=e=>{
const img=new Image();
img.onload=()=>{
const c=document.createElement("canvas");
let w=img.width,h=img.height;
if(w>h&&w>maxSize){h=h*maxSize/w;w=maxSize}
else if(h>maxSize){w=w*maxSize/h;h=maxSize}
c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
cb(c.toDataURL("image/jpeg",0.7));
};
img.src=e.target.result;
};
r.readAsDataURL(file);
}

function parseShareText(text,platform){
text=(text||"").trim();
if(!text)return null;
const urlMatch=text.match(/https?:\/\/[^\s，。]+/);
const url=urlMatch?urlMatch[0]:"";
let clean=text.replace(url,"").replace(/复制此链接[^\s]*$/,"").replace(/打开[Dd]ou[音污]短视频[^\s]*/,"").replace(/，直接观看视频！?/,"").trim();
const tagMatches=clean.match(/#[^\s#]+/g)||[];
const tags=tagMatches.map(t=>t.replace(/^#/,"").trim()).filter(t=>t.length>0);
clean=clean.replace(/#[^\s#]+/g,"").replace(/\s+/g," ").trim();
let title=clean;
let desc=clean;
if(clean.length>40){const sep=clean.search(/[！。！？\n!?.]/);if(sep>5&&sep<60){title=clean.slice(0,sep+1).trim();desc=clean.slice(sep+1).trim()||clean}}
if(!title&&url){title=platform==="douyin"?"【抖音视频】":platform==="xhs"?"【小红书笔记】":"【收藏链接】"}
const author="";
return{url,title,description:desc,tags,author};
}
function extractKeywords(text,n){
n=n||5;
text=(text||"").replace(/https?:\/\/[^\s]+/g,"").replace(/#[^\s#]+/g,"").replace(/[^\u4e00-\u9fa5a-zA-Z0-9\s]/g," ").trim();
if(!text)return[];
const stopWords=new Set(["的","了","是","在","我","有","和","就","不","人","都","一","上","也","很","到","说","要","去","你","会","着","没","看","好","这","那","他","她","它","们","个","来","中","做","把","被","让","从","向","为","以","于","对","给","跟","和","与","及","或","但","而","如","若","则","才","又","且","并","the","a","an","is","are","was","were","to","of","in","on","at","for","and","or","but","with"]);
const freq={};
for(let len=2;len<=3;len++){
for(let i=0;i<=text.length-len;i++){
const word=text.slice(i,i+len);
if(/\d/.test(word)&&len===2)continue;
if(len===2&&!/[\u4e00-\u9fa5]/.test(word))continue;
if(len===3&&!/[\u4e00-\u9fa5]{2,}/.test(word))continue;
const parts=len===2?[word]:[word.slice(0,2),word.slice(1,3)];
if(parts.some(p=>stopWords.has(p)))continue;
freq[word]=(freq[word]||0)+1;
}
}
const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
const result=[];
const used=new Set();
for(const[w,c]of sorted){
if(result.length>=n)break;
let overlap=false;
for(const u of used){if(w.includes(u)||u.includes(w)){if(c<=freq[u]+1){overlap=true;break}}}
if(!overlap){result.push(w);used.add(w)}
}
return result;
}
function generateSummary(text){
text=(text||"").replace(/https?:\/\/[^\s]+/g,"").replace(/#[^\s#]+/g,"").replace(/\s+/g," ").trim();
if(!text)return"暂无描述";
if(text.length<=80)return text;
const cut=text.slice(0,80);
const lastSep=cut.lastIndexOf("，");
if(lastSep>40)return cut.slice(0,lastSep)+"...";
return cut+"...";
}
function analyzeContent(parsed){
const fullText=((parsed.title||"")+" "+(parsed.description||"")).trim();
return{
summary:generateSummary(fullText)
};
}
function batchParse(text,platform){
const lines=text.split(/\n/).map(l=>l.trim()).filter(l=>l.length>0);
const results=[];
for(const line of lines){
const parsed=parseShareText(line,platform);
if(parsed&&(parsed.url||parsed.title)){
const analysis=analyzeContent(parsed);
results.push({...parsed,...analysis});
}
}
return results;
}

<div class="form-group"><label>📍 地点 / 事项</label><input id="task-place" placeholder="如：工作室·内容创作" value="${defPlace}"></div>
<div class="form-group"><label>🎯 优先级</label><select id="task-priority"><option value="低优" ${defPri==='低优'?'selected':''}>🔵 低优</option><option value="中优" ${defPri==='中优'?'selected':''}>🟣 中优</option><option value="高优" ${defPri==='高优'?'selected':''}>🩷 高优</option></select></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="task-save">添加</button></div>`);
$("#task-save").onclick=()=>{
const time=$("#task-time").value;
const place=$("#task-place").value.trim();
const priority=$("#task-priority").value;
if(!time||!place){toast("请填写完整");return}
const tasks=Store.get("todayTasks");
tasks.push({id:"t_"+Date.now(),time,place,priority,done:false,reminded:false});
tasks.sort((a,b)=>(a.time||"").localeCompare(b.time||""));
Store.set("todayTasks",tasks);
closeModal();rerender();toast("✅ 行程已添加");
};
},
toggleDone(id){
const tasks=Store.get("todayTasks");
const t=tasks.find(x=>(x.id||"")===id||String(tasks.indexOf(x))===String(id));
if(!t)return;
t.done=!t.done;
Store.set("todayTasks",tasks);
rerender();
},
editTask(id){
const tasks=Store.get("todayTasks");
const t=tasks.find(x=>(x.id||"")===id||String(tasks.indexOf(x))===String(id));
if(!t)return;
showModal(`<div class="modal-title">✏️ 编辑行程</div>
<div class="form-group"><label>⏰ 时间</label><input id="task-time" type="time" value="${t.time}"></div>
<div class="form-group"><label>📍 地点 / 事项</label><input id="task-place" value="${t.place}"></div>
<div class="form-group"><label>🎯 优先级</label><select id="task-priority"><option value="低优" ${t.priority==='低优'?'selected':''}>🔵 低优</option><option value="中优" ${t.priority==='中优'?'selected':''}>🟣 中优</option><option value="高优" ${t.priority==='高优'?'selected':''}>🩷 高优</option></select></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="task-save">保存</button></div>`);
$("#task-save").onclick=()=>{
const time=$("#task-time").value;
const place=$("#task-place").value.trim();
const priority=$("#task-priority").value;
if(!time||!place){toast("请填写完整");return}
t.time=time;t.place=place;t.priority=priority;
tasks.sort((a,b)=>(a.time||"").localeCompare(b.time||""));
Store.set("todayTasks",tasks);
closeModal();rerender();toast("✅ 已保存");
};
},
deleteTask(id){
const tasks=Store.get("todayTasks");
const idx=typeof id==="number"?id:tasks.findIndex(x=>(x.id||"")===id);
if(idx<0)return;
const t=tasks[idx];
confirmModal("删除行程",`确定删除「${t.time} ${t.place}」？`,()=>{
tasks.splice(idx,1);
Store.set("todayTasks",tasks);
rerender();toast("已删除");
});
}
};

// ---- 2. 小红书 ----
Panels.xhs={
render(){
const notes=Store.get("xhsNotes");
const pending=notes.filter(n=>n.status==="待发");
const published=notes.filter(n=>n.status==="已发");
const drafts=notes.filter(n=>n.status==="草稿");
const favs=Store.get("xhsFavorites");
const cats=Store.get("xhsFavCats");
const now=new Date();

const learned=favs.filter(f=>f.learned).length;
const unlearned=favs.length-learned;
return`
<div class="card" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
<span class="stat-capsule" style="background:var(--orange-50);color:var(--orange)">待发布 ${pending.length}</span>
<span class="stat-capsule" style="background:var(--highlight);color:var(--primary-dark)">已发布 ${published.length}</span>
<span class="stat-capsule" style="background:var(--light-gray);color:var(--text-3)">草稿 ${drafts.length}</span>
</div>
<div class="card">
<div class="card-title">💡 快速记录灵感</div>
<div style="display:flex;gap:8px">

<button class="btn btn-sm" onclick="Panels.xhs.saveInspiration()">记录</button>
<button class="btn btn-sm btn-outline" onclick="Panels.xhs.voiceInspire()">🎤</button>
</div>
</div>
<div class="card">
<div class="card-title">🔥 爆款选题推荐</div>
${topics.map((t,i)=>`<div class="suggestion-item"><span class="suggestion-text">🔥 ${t}</span><button class="btn btn-sm btn-outline" onclick="Panels.xhs.adoptTopic('${t.replace(/'/g,"\\'")}')">采纳</button></div>`).join("")}
</div>
<div class="section-title">📝 笔记列表</div>
${notes.length?notes.map(n=>this.noteCard(n)).join(""):'<div class="empty">暂无笔记，记录灵感或采纳选题开始创作</div>'}
<div class="section-title">🗂️ 小红书收藏 <span style="font-size:12px;color:var(--gray);font-weight:400">已学 ${learned} / 未学 ${unlearned} / 总计 ${favs.length}</span></div>
<div class="card">
<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px" id="xhs-cat-tabs">
<span class="cat-tab active" onclick="Panels.xhs.filterFavCat('')">全部</span>
${cats.map(c=>`<span class="cat-tab" onclick="Panels.xhs.filterFavCat('${c.replace(/'/g,"\\'")}')">${c}</span>`).join("")}
<button class="cat-tab" style="background:var(--bg-light)" onclick="Panels.xhs.addFavCat()">➕</button>
<button class="cat-tab" style="background:var(--bg-light)" onclick="Panels.xhs.manageFavCats()">✏️</button>
</div>
${(()=>{const allTags=[...new Set(favs.flatMap(f=>f.tags||[]))].sort();return allTags.length?`<div class="tag-filter-bar" id="xhs-tag-bar"><span class="tag-filter-chip active" onclick="Panels.xhs.filterFavTag('')">全部标签</span>${allTags.map(t=>`<span class="tag-filter-chip" onclick="Panels.xhs.filterFavTag('${t.replace(/'/g,"\\'")}')">${t}</span>`).join("")}</div>`:""})()}
<div class="sort-bar">
<select id="xhs-fav-sort" onchange="Panels.xhs.sortFavBy(this.value)">
<option value="new">最新添加</option>
<option value="old">最早添加</option>
<option value="title">按标题</option>
</select>
<input id="xhs-fav-search" placeholder="搜索标题/描述/标签..." style="flex:1;padding:6px 10px;font-size:12px" oninput="Panels.xhs.searchFav()">
</div>
<div style="display:flex;gap:8px;margin-bottom:10px">
<button class="btn btn-sm btn-outline" style="flex:1" onclick="Panels.xhs.showFavBatchImport()">📥 批量导入</button>
<button class="btn btn-sm" style="flex:1" onclick="Panels.xhs.showAddFavForm()">➕ 单个添加</button>
</div>
<div id="xhs-fav-list">
${favs.length?this.renderFavList(favs):'<div class="empty">暂无收藏，点击 ➕ 添加或 📥 批量导入</div>'}
</div>
</div>
`;
},
_xhsFilter:{cat:"",tag:"",sort:"new",q:""},
renderFavList(favs){
const f=this._xhsFilter;
let list=favs.slice();
if(f.cat)list=list.filter(x=>x.category===f.cat);
if(f.tag)list=list.filter(x=>(x.tags||[]).includes(f.tag));
if(f.q){const q=f.q.toLowerCase();list=list.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.description||"").toLowerCase().includes(q)||(x.tags||[]).some(t=>t.toLowerCase().includes(q))||(x.note||"").toLowerCase().includes(q))}
if(f.sort==="old")list.sort((a,b)=>a.id-b.id);
else if(f.sort==="title")list.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
else list.sort((a,b)=>b.id-a.id);
if(!list.length)return'<div class="empty">没有匹配的收藏</div>';
return list.map(x=>this.favCard(x)).join("");
},
favCard(f){
const tagsHtml=(f.tags||[]).map(t=>`<span class="fav-tag-chip">${t}</span>`).join("");
return`<div class="fav-card" data-xcat="${f.category}" data-xtitle="${(f.title||"").replace(/"/g,"&quot;")}" data-xtags="${(f.tags||[]).join(",")}" data-xdesc="${(f.description||"").replace(/"/g,"&quot;")}" data-xnote="${(f.note||"").replace(/"/g,"&quot;")}" onclick="Panels.xhs.showFavDetail(${f.id})">
<div style="display:flex;align-items:flex-start;gap:8px">
<input type="checkbox" ${f.learned?"checked":""} onchange="event.stopPropagation();Panels.xhs.toggleFavLearn(${f.id})" style="flex-shrink:0;margin-top:2px">
<div style="flex:1;min-width:0">
<div class="fav-card-title">${f.title||"无标题"}</div>
<div class="fav-card-meta">@${f.author||"未知"} · ${f.category} · ${f.timeStr||""}</div>
${tagsHtml?`<div class="fav-tags-row">${tagsHtml}</div>`:""}
${f.summary?`<div class="fav-card-summary">${f.summary}</div>`:""}
${f.note?`<div style="font-size:11px;color:var(--accent);margin-top:4px">📝 ${f.note}</div>`:""}
</div>
</div>
</div>`;
},
showFavDetail(id){
const favs=Store.get("xhsFavorites");
const f=favs.find(x=>x.id===id);
if(!f)return;
const tagsHtml=(f.tags||[]).map(t=>`<span class="fav-tag-chip">${t}</span>`).join("");
showModal(`<div class="modal-title">📋 收藏详情</div>
<div class="fav-detail-row"><div class="fav-detail-label">标题</div><div class="fav-detail-value" style="font-weight:600">${f.title||"无标题"}</div></div>
<div class="fav-detail-row"><div class="fav-detail-label">作者</div><div class="fav-detail-value">@${f.author||"未知"}</div></div>
<div class="fav-detail-row"><div class="fav-detail-label">收藏夹</div><div class="fav-detail-value">${f.category}</div></div>
<div class="fav-detail-row"><div class="fav-detail-label">添加时间</div><div class="fav-detail-value">${f.timeStr||""}</div></div>
${f.url?`<div class="fav-detail-row"><div class="fav-detail-label">链接</div><div class="fav-detail-value"><a href="${f.url}" target="_blank" style="color:var(--primary)">${f.url.slice(0,40)}...</a></div></div>`:""}
${f.description?`<div class="fav-detail-row"><div class="fav-detail-label">描述</div><div class="fav-detail-value">${f.description}</div></div>`:""}
${tagsHtml?`<div class="fav-detail-row"><div class="fav-detail-label">标签</div><div class="fav-detail-value"><div class="fav-tags-row">${tagsHtml}</div></div></div>`:""}
${f.summary?`<div class="fav-detail-row"><div class="fav-detail-label">摘要</div><div class="fav-detail-value" style="background:var(--bg-soft);padding:6px 8px;border-radius:8px">${f.summary}</div></div>`:""}
<div class="fav-detail-row"><div class="fav-detail-label">📝 备注</div><div class="fav-detail-value"><textarea id="xhs-note" placeholder="添加你的笔记..." style="min-height:50px;font-size:12px">${(f.note||"").replace(/</g,"&lt;")}</textarea></div></div>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn btn-sm" style="flex:1" onclick="Panels.xhs.saveFavNote(${f.id})">💾 保存备注</button>
<button class="btn btn-sm btn-outline" style="flex:1" onclick="Panels.xhs.editFav(${f.id})">✏️ 编辑</button>
<button class="btn btn-sm btn-danger" style="flex:1" onclick="Panels.xhs.delFav(${f.id})">🗑 删除</button>
</div>`);
},
saveFavNote(id){
const favs=Store.get("xhsFavorites");
const f=favs.find(x=>x.id===id);
if(f){f.note=$("#xhs-note").value.trim();Store.set("xhsFavorites",favs);toast("✅ 备注已保存")}
},
editFav(id){
const favs=Store.get("xhsFavorites");
const f=favs.find(x=>x.id===id);
if(!f)return;
const cats=Store.get("xhsFavCats");
showModal(`<div class="modal-title">✏️ 编辑收藏</div>
<div class="form-group"><label>标题</label><input id="xed-title" value="${(f.title||"").replace(/"/g,"&quot;")}"></div>
<div class="form-group"><label>作者</label><input id="xed-author" value="${f.author||""}"></div>
<div class="form-group"><label>链接</label><input id="xed-url" value="${f.url||""}"></div>
<div class="form-group"><label>描述</label><textarea id="xed-desc" style="min-height:50px">${(f.description||"").replace(/</g,"&lt;")}</textarea></div>
<div class="form-group"><label>标签（逗号分隔）</label><input id="xed-tags" value="${(f.tags||[]).join(", ")}"></div>
<div class="form-group"><label>收藏夹</label><select id="xed-cat">${cats.map(c=>`<option ${c===f.category?"selected":""}>${c}</option>`).join("")}</select></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="xed-save">保存</button></div>`);
$("#xed-save").onclick=()=>{
f.title=$("#xed-title").value.trim();
f.author=$("#xed-author").value.trim();
f.url=$("#xed-url").value.trim();
f.description=$("#xed-desc").value.trim();
f.tags=$("#xed-tags").value.split(/[,，]/).map(t=>t.trim()).filter(t=>t);
f.category=$("#xed-cat").value;
const analysis=analyzeContent({title:f.title,description:f.description,tags:f.tags});
f.summary=analysis.summary;
Store.set("xhsFavorites",favs);
closeModal();rerender();toast("✅ 已更新");
};
},
showFavBatchImport(){
const cats=Store.get("xhsFavCats");
showModal(`<div class="modal-title">📥 批量导入小红书收藏</div>
<div class="form-group"><label>粘贴分享文本（每条一行）</label><textarea class="batch-area" id="xhs-batch-input" placeholder="将小红书「分享」复制的文字粘贴到这里，每条一行。&#10;例如：&#10;小红书爆款标题公式 #小红书运营 https://www.xiaohongshu.com/explore/xxx&#10;3个技巧让封面点击率翻倍 #自媒体 https://www.xiaohongshu.com/explore/yyy"></textarea></div>
<div class="form-group"><label>收藏夹</label><select id="xhs-batch-cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select></div>
<button class="btn btn-sm btn-outline btn-block" id="xhs-batch-preview-btn" style="margin-bottom:10px">🔍 预览解析结果</button>
<div id="xhs-batch-preview"></div>
<div style="display:flex;gap:10px;margin-top:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="xhs-batch-import-btn">📥 导入</button></div>`);
$("#xhs-batch-preview-btn").onclick=()=>Panels.xhs.previewFavBatch();
$("#xhs-batch-import-btn").onclick=()=>Panels.xhs.doFavBatchImport();
},
previewFavBatch(){
const text=$("#xhs-batch-input").value.trim();
if(!text){toast("请先粘贴内容");return}
const cat=$("#xhs-batch-cat").value;
const items=batchParse(text,"xhs");
if(!items.length){toast("未解析到有效内容");return}
const html=items.map((it,i)=>`<div class="import-preview-item"><div class="ipt-title">${i+1}. ${it.title}</div><div class="ipt-meta">${it.tags.length?"标签: "+it.tags.join(", ")+" · ":""}${it.url?"有链接":"无链接"} · 摘要: ${it.summary.slice(0,30)}...</div></div>`).join("");
$("#xhs-batch-preview").innerHTML=`<div style="font-size:11px;color:var(--gray);margin-bottom:6px">解析到 ${items.length} 条，收藏夹: ${cat}</div>${html}`;
},
doFavBatchImport(){
const text=$("#xhs-batch-input").value.trim();
if(!text){toast("请先粘贴内容");return}
const cat=$("#xhs-batch-cat").value;
const items=batchParse(text,"xhs");
if(!items.length){toast("未解析到有效内容");return}
const favs=Store.get("xhsFavorites");
let now=Date.now();
for(const it of items){
favs.unshift({id:now++,url:it.url,title:it.title,author:it.author||"",description:it.description,tags:it.tags,summary:it.summary,category:cat,note:"",learned:false,time:new Date().toISOString(),timeStr:fmtDateTime(new Date())});
}
Store.set("xhsFavorites",favs);
closeModal();rerender();toast("✅ 已导入 "+items.length+" 条收藏");
},
init(){
$("#global-fab").classList.add("hidden");
},
onLeave(){$("#global-fab").classList.add("hidden")},
filterFavCat(cat){
this._xhsFilter.cat=cat;
$$("#xhs-cat-tabs .cat-tab").forEach(t=>t.classList.remove("active"));
if(cat===""){$$("#xhs-cat-tabs .cat-tab")[0].classList.add("active")}
else{$$("#xhs-cat-tabs .cat-tab").forEach(t=>{if(t.textContent===cat)t.classList.add("active")})}
const favs=Store.get("xhsFavorites");
$("#xhs-fav-list").innerHTML=this.renderFavList(favs);
},
filterFavTag(tag){
this._xhsFilter.tag=tag;
const bar=$("#xhs-tag-bar");
if(bar){$$("#xhs-tag-bar .tag-filter-chip").forEach(c=>c.classList.remove("active"));
if(tag===""){$$("#xhs-tag-bar .tag-filter-chip")[0].classList.add("active")}
else{$$("#xhs-tag-bar .tag-filter-chip").forEach(c=>{if(c.textContent===tag)c.classList.add("active")})}
}
const favs=Store.get("xhsFavorites");
$("#xhs-fav-list").innerHTML=this.renderFavList(favs);
},
sortFavBy(v){
this._xhsFilter.sort=v;
const favs=Store.get("xhsFavorites");
$("#xhs-fav-list").innerHTML=this.renderFavList(favs);
},
searchFav(){
this._xhsFilter.q=$("#xhs-fav-search").value.toLowerCase();
const favs=Store.get("xhsFavorites");
$("#xhs-fav-list").innerHTML=this.renderFavList(favs);
},
showAddFavForm(){
const cats=Store.get("xhsFavCats");
showModal(`<div class="modal-title">➕ 添加小红书收藏</div>
<div class="form-group"><label>小红书链接 或 分享文本</label><textarea id="xhs-fav-link" placeholder="粘贴小红书分享文本或链接" style="min-height:50px"></textarea></div>
<div class="form-group"><label>来源博主</label><input id="xhs-fav-author" placeholder="@博主名"></div>
<div class="form-group"><label>收藏夹</label><select id="xhs-fav-cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="xhs-fav-save">添加</button></div>`);
$("#xhs-fav-save").onclick=()=>{
const link=$("#xhs-fav-link").value.trim();
const author=$("#xhs-fav-author").value.trim();
const cat=$("#xhs-fav-cat").value;
if(!link){toast("请输入链接或标题");return}
const parsed=parseShareText(link,"xhs");
const analysis=analyzeContent(parsed);
const favs=Store.get("xhsFavorites");
const now=new Date();
favs.unshift({id:Date.now(),url:parsed.url,title:parsed.title,author,description:parsed.description,tags:parsed.tags,summary:analysis.summary,category:cat,note:"",learned:false,time:now.toISOString(),timeStr:fmtDateTime(now)});
Store.set("xhsFavorites",favs);
closeModal();rerender();toast("✅ 已添加收藏");
};
},
addFavCat(){
showModal(`<div class="modal-title">添加收藏夹</div>
<div class="form-group"><input id="new-xcat" placeholder="收藏夹名称"></div>
<div style="display:flex;gap:10px"><button class="btn btn-gray btn-block" onclick="closeModal()">取消</button><button class="btn btn-block" id="xcat-save">添加</button></div>`);
$("#xcat-save").onclick=()=>{
const v=$("#new-xcat").value.trim();
if(!v){toast("请输入收藏夹名");return}
const cats=Store.get("xhsFavCats");
if(!cats.includes(v)){cats.push(v);Store.set("xhsFavCats",cats)}
closeModal();rerender();
};
},
manageFavCats(){
const cats=Store.get("xhsFavCats");
const items=cats.map((c,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bg-light)">
<input id="xcat-name-${i}" value="${c}" style="flex:1" onkeydown="if(event.key==='Enter')Panels.xhs.renameFavCat(${i},this.value)">
<button class="btn btn-sm" onclick="Panels.xhs.renameFavCat(${i},document.getElementById('xcat-name-${i}').value)">保存</button>
<button class="btn btn-sm btn-danger" onclick="Panels.xhs.deleteFavCat('${c.replace(/'/g,"\\'")}')">删除</button>
</div>`).join("");
showModal(`<div class="modal-title">✏️ 管理收藏夹</div>
<div style="max-height:300px;overflow-y:auto">${items}</div>
<div style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-gray btn-block" onclick="closeModal()">关闭</button></div>`);
},
renameFavCat(i,newName){
newName=newName.trim();
if(!newName){toast("收藏夹名不能为空");return}
const cats=Store.get("xhsFavCats");
const oldName=cats[i];
if(oldName===newName){closeModal();return}
if(cats.includes(newName)){toast("收藏夹名已存在");return}
cats[i]=newName;
Store.set("xhsFavCats",cats);
const favs=Store.get("xhsFavorites");

renderList(favs){
const f=this._dyFilter;
let list=favs.slice();
if(f.cat)list=list.filter(x=>x.category===f.cat);
if(f.tag)list=list.filter(x=>(x.tags||[]).includes(f.tag));
if(f.q){const q=f.q.toLowerCase();list=list.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.description||"").toLowerCase().includes(q)||(x.tags||[]).some(t=>t.toLowerCase().includes(q))||(x.note||"").toLowerCase().includes(q))}
if(f.sort==="old")list.sort((a,b)=>a.id-b.id);
else if(f.sort==="title")list.sort((a,b)=>(a.title||"").localeCompare(b.title||""));

countdownHtml=`<div class="countdown-badge">⏳ 距离「${g.name}」还有 ${days} 天</div>`;
}else{
countdownHtml=`<div class="countdown-badge" style="opacity:.6">⏳ 暂无倒计时目标，请添加学习目标</div>`;

<button class="btn btn-sm btn-outline btn-block" onclick="Panels.learning.addSkill()">➕ 添加技能</button>
</div>

Panels.weekly={
render(){
const reviews=Store.get("weeklyReviews");
const now=new Date();
const weekLabel=getWeekLabel(now);
const exist=reviews.find(r=>r.week===weekLabel);
// comparison
const thisWeek=reviews.find(r=>r.week===weekLabel);
const lastWeekLabel=getWeekLabel(new Date(now.getTime()-7*86400000));
const lastWeek=reviews.find(r=>r.week===lastWeekLabel);
let compareHtml="";
if(thisWeek&&lastWeek){
const tasksThis=parseInt(thisWeek.metrics?.tasks)||0;
const tasksLast=parseInt(lastWeek.metrics?.tasks)||0;
const studyThis=parseInt(thisWeek.metrics?.study)||0;
const studyLast=parseInt(lastWeek.metrics?.study)||0;
const taskDiff=tasksThis-tasksLast;
const studyDiff=studyThis-studyLast;
compareHtml=`<div class="card" style="background:var(--bg-light)">
<div class="card-title">📊 环比变化</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<span class="tag ${taskDiff>=0?"tag-green":"tag-red"}">任务完成率 ${taskDiff>=0?"⬆️":"⬇️"} ${Math.abs(taskDiff)}%</span>
<span class="tag ${studyDiff>=0?"tag-green":"tag-red"}">学习时长 ${studyDiff>=0?"⬆️":"⬇️"} ${Math.abs(studyDiff)}分钟</span>
</div>
</div>`;
}
return`
${compareHtml}
<div class="card">
<div class="card-title">📊 ${weekLabel} 复盘</div>
<div class="form-group"><label>📊 本周关键指标</label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">

</div>
</div>
<div class="form-group"><label>✅ 本周里程碑（最骄傲的3件事）</label><textarea id="wr-milestones" placeholder="1. ...&#10;2. ...&#10;3. ...">${exist?.milestones||""}</textarea></div>
<div class="form-group"><label>⚠️ 本周障碍（影响效率的因素）</label><textarea id="wr-obstacles" placeholder="主要干扰因素...">${exist?.obstacles||""}</textarea></div>
<div class="form-group"><label>📅 下周展望（核心目标与策略）</label><textarea id="wr-outlook" placeholder="下周计划...">${exist?.outlook||""}</textarea></div>
<button class="btn btn-block" onclick="Panels.weekly.save()">💾 保存周复盘</button>
</div>
<div class="card">
<button class="btn btn-outline btn-block" onclick="Panels.weekly.generateSummary()">📝 生成周报摘要</button>
<div id="weekly-summary" style="display:none;margin-top:10px">
<textarea id="summary-text" style="min-height:120px;font-size:12px"></textarea>
<button class="btn btn-sm btn-block" style="margin-top:8px" onclick="Panels.weekly.copySummary()">📋 复制文本</button>
</div>
</div>
<div class="section-title">📜 历史周复盘</div>
${reviews.length?reviews.map(r=>`<div class="review-history-item" onclick="this.querySelector('.review-detail').classList.toggle('show')">

init(){
$("#global-fab").classList.add("hidden");
},
onLeave(){$("#global-fab").classList.add("hidden")},
save(){

const milestones=$("#wr-milestones").value.trim();
const obstacles=$("#wr-obstacles").value.trim();

reviews.sort((a,b)=>b.week.localeCompare(a.week));
Store.set("weeklyReviews",reviews);
rerender();toast("✅ 周复盘已保存");

generateSummary(){
const metrics={tasks:$("#wr-tasks").value,pages:$("#wr-pages").value,exercise:$("#wr-exercise").value,study:$("#wr-study").value};
const milestones=$("#wr-milestones").value.trim();
const obstacles=$("#wr-obstacles").value.trim();
const outlook=$("#wr-outlook").value.trim();
const weekLabel=getWeekLabel(new Date());
let text=`【${weekLabel}周报摘要】\n\n`;
text+=`📊 本周关键指标：完成番茄钟${metrics.tasks||0}个，阅读${metrics.pages||0}页，运动${metrics.exercise||0}次，学习${metrics.study||0}分钟。\n\n`;
text+=`✅ 本周里程碑：\n${milestones||"暂无记录"}\n\n`;
text+=`⚠️ 本周障碍：\n${obstacles||"暂无记录"}\n\n`;
text+=`📅 下周展望：\n${outlook||"暂无记录"}\n\n`;
text+=`—— 以上为${todayKey()}自动生成`;
$("#weekly-summary").style.display="block";
$("#summary-text").value=text;
toast("✅ 周报摘要已生成");
},
copySummary(){
const text=$("#summary-text").value;
if(navigator.clipboard){
navigator.clipboard.writeText(text).then(()=>toast("📋 已复制到剪贴板")).catch(()=>Panels.weekly.fallbackCopy(text));
}else{
Panels.weekly.fallbackCopy(text);
}
},
fallbackCopy(text){
const ta=document.createElement("textarea");
ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
document.body.appendChild(ta);ta.select();
try{document.execCommand("copy");toast("📋 已复制到剪贴板")}catch(e){toast("复制失败，请手动选择文本复制")}
document.body.removeChild(ta);
}
};

//==================== SIDEBAR TOGGLE ====================
function isMobile(){return window.innerWidth<=768}
function toggleSidebar(){
$("#app").classList.toggle("sidebar-open");
}
function closeSidebarDrawer(){
const app=$("#app");
app.classList.remove("sidebar-open");
$(".sidebar-toggle").textContent="☰";
}

//==================== NAVIGATION ====================
function switchPanel(name){
if(currentPanel&&Panels[currentPanel]&&Panels[currentPanel].onLeave)Panels[currentPanel].onLeave();
currentPanel=name;
$$("#sidebar .nav-item").forEach(el=>el.classList.toggle("active",el.dataset.panel===name));
renderTabBar();
if(isMobile())closeSidebarDrawer();
rerender();
window.scrollTo(0,0);
}
function rerender(){
const p=Panels[currentPanel];
if(!p)return;
$("#content").innerHTML=p.render();
if(p.init)p.init();
}

//==================== SIDEBAR ====================
function renderSidebar(){
const activeId=currentPanel||"overview";
const header=`<div class="drawer-header"><button class="drawer-menu-btn" onclick="closeSidebarDrawer()" aria-label="关闭">☰</button><div class="drawer-title">Jane 的工作台</div></div>`;
const body=MENU.map(cat=>{
const items=cat.items.map(m=>`<div class="nav-item${m.id===activeId?" active":""}" data-panel="${m.id}" onclick="switchPanel('${m.id}')"><span class="nav-icon-box">${m.icon}</span><span>${m.label}</span></div>`).join("");
return`<div class="drawer-section"><div class="drawer-section-title">${cat.category}</div>${items}</div>`;
}).join("");
const footer=`<div class="drawer-sync"><button class="btn btn-block">☁️ 同步到手机云端</button></div>`;
$("#sidebar").innerHTML=header+body+footer;
}

//==================== TAB BAR ====================
function renderTabBar(){
const activeId=currentPanel||"overview";
const html=TAB_BAR.map(t=>{
const isActive=t.id!=="showDrawer"&&t.id===activeId;
if(t.action==="openDrawer"){
return`<button class="tab-bar-item ${isActive?"active":""} ${t.cls}" onclick="toggleSidebar()"><span class="tab-icon">${t.icon}</span><span>${t.label}</span></button>`;
}
return`<button class="tab-bar-item ${isActive?"active":""} ${t.cls}" onclick="switchPanel('${t.id}')"><span class="tab-icon">${t.icon}</span><span>${t.label}</span></button>`;
}).join("");
$("#tab-bar").innerHTML=html;
}

//==================== APP BAR ====================
function renderAppBar(){
const now=new Date();
const weekDays=["日","一","二","三","四","五","六"];
const dateStr=`${now.getMonth()+1}月${now.getDate()}日 周${weekDays[now.getDay()]}`;
const el=$("#app-bar-date-text");
if(el)el.textContent=dateStr;
}
function goHome(){
switchPanel("overview");
}

//==================== REMINDERS ====================
function checkReminders(){
const now=new Date();
const h=now.getHours(),m=now.getMinutes();
const timeStr=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
// Water reminder
if(h>=9&&h<21&&m%30===0){
const key=`water_${todayKey()}_${h}_${m}`;
if(!Store.get("reminder_"+key)){
notify("💧 该喝水啦！","保持水分摄入，健康每一天～");
Store.set("reminder_"+key,true);
}
}
// Task reminders
const tasks=Store.get("todayTasks");
let changed=false;
tasks.forEach(t=>{
if(t.time===timeStr&&!t.done&&!t.reminded){
notify("⏰ 任务提醒",t.place);
t.reminded=true;changed=true;
}
});
if(changed)Store.set("todayTasks",tasks);
// XHS publish reminders
const notes=Store.get("xhsNotes");
let nChanged=false;
notes.forEach(n=>{
if(n.publishTime){
const pt=n.publishTime.replace("T"," ").substring(0,5);
if(pt===timeStr&&n.status==="待发"&&!n.publishReminded){
notify("📢 发布提醒",`《${n.title}》计划发布时间到了！`);
n.publishReminded=true;nChanged=true;
}
}
});
if(nChanged)Store.set("xhsNotes",notes);
}

//==================== AI HOT AUTO REFRESH ====================
function checkAIAutoRefresh(){
const s=Store.get("settings");
if(!s.hotPush)return;
const freq=s.topicFreq;
if(freq==="manual")return;
const ai=Store.data.aiData;
if(!ai)return;
const lastRefresh=ai.date?new Date(ai.date):new Date(0);
const now=new Date();
const diff=now-lastRefresh;
if(freq==="daily"&&diff>86400000){
generateAIData();rerender();
}else if(freq==="6h"&&diff>21600000){
generateAIData();rerender();
}
}

//==================== INIT ====================
function init(){
Store.init();
$("#app").classList.remove("sidebar-open");
renderAppBar();
renderSidebar();
renderTabBar();
rerender();
// Request notification permission
if("Notification"in window&&Notification.permission==="default"){
Notification.requestPermission();
}
// Start reminder timer
setInterval(checkReminders,60000);
// Start AI auto refresh checker
setInterval(checkAIAutoRefresh,600000);
// Screen always on
const s=Store.get("settings");
if(s.screenOn&&"wakeLock"in navigator){
navigator.wakeLock.request("screen").catch(()=>{});
}
}
document.addEventListener("DOMContentLoaded",init);
window.addEventListener("resize",()=>{
$("#app").classList.remove("sidebar-open");
});
// Prevent modal close on tap outside content
$("#modal-overlay").addEventListener("click",e=>{if(e.target.id==="modal-overlay")closeModal()});
</script>
